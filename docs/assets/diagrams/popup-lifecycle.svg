<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Proposed popup lifecycle</title><desc id="desc">Closed to Admitting to In window to Restoring to Closed. In window can hand off to the opening screen and return.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<style>text{font:18px sans-serif;fill:#172033}rect{fill:#eef3fa;stroke:#64748b;stroke-width:2}.arrow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}</style>
<rect x="1" y="1" width="958" height="278" rx="12" style="fill:white;stroke:#cbd5e1"/>
<rect x="20" y="55" width="140" height="58" rx="10"/><text x="90" y="90" text-anchor="middle">Closed</text><rect x="210" y="55" width="150" height="58" rx="10"/><text x="285" y="90" text-anchor="middle">Admitting</text><rect x="410" y="55" width="160" height="58" rx="10"/><text x="490" y="90" text-anchor="middle">In window</text><rect x="620" y="55" width="150" height="58" rx="10"/><text x="695" y="90" text-anchor="middle">Restoring</text><rect x="820" y="55" width="120" height="58" rx="10"/><text x="880" y="90" text-anchor="middle">Closed</text><path class="arrow" d="M160 84L207 84"/><path class="arrow" d="M360 84L407 84"/><path class="arrow" d="M570 84L617 84"/><path class="arrow" d="M770 84L817 84"/><rect x="410" y="185" width="160" height="58" rx="10"/><text x="490" y="220" text-anchor="middle">Handed off</text><path class="arrow" d="M450 113L450 182"/><path class="arrow" d="M530 185L530 116"/>
</svg>
