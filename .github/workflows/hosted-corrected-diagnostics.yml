# Source commits are pinned; publication and native execution remain separate authorized actions.
# Opt-in diagnostics only: no release gate, compatibility, production, or APK delivery changes.
name: Hosted corrected diagnostics (not release evidence)
'on':
  push:
    branches: [test/hosted-corrected-diagnostics-20261027]
    paths:
      - .github/workflows/hosted-corrected-diagnostics.yml
      - .github/run-corrected-diagnostics.sh
      - .github/reconcile-corrected-diagnostics.py

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hosted-corrected-diagnostics-${{ github.ref }}
  # Do not silently cancel a run or discard its first failure on a later push.
  cancel-in-progress: false

jobs:
  exact:
    name: Corrected ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: dialog26
            api: 26
            source: cfc20fd22b6295d2336d861dcf867e4bcc903b3f
          - case: popup26
            api: 26
            source: 25fa9a7b462e9d5fddc535ae69306d2e56be508d
          - case: popup36
            api: 36
            source: 25fa9a7b462e9d5fddc535ae69306d2e56be508d
    env:
      EXACT_CASE: ${{ matrix.case }}
      TEST_API: ${{ matrix.api }}
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Checkout diagnostic harness at the event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          sparse-checkout: .github
      - name: Checkout immutable test source (never overlay tests)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
          path: source
          # Parent identity is checked; a depth-1 shallow boundary hides %P.
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout immutable monitoring and device-ownership helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1e31403cb042e9896686200a4800faffce9b2a59
          path: tooling
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Create fresh immutable provenance and source method inventory
        run: bash harness/.github/run-corrected-diagnostics.sh prepare "$EXACT_CASE" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/corrected-evidence-$EXACT_CASE"
      - name: Install the pinned live evidence publisher
        run: npm ci --prefix tooling/.github/test-evidence --ignore-scripts --no-audit --no-fund
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room for disposable emulator userdata
        run: |
          # This diagnostic Android job does not use the preinstalled .NET SDKs.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Compile the exact test inputs before emulator startup
        working-directory: source
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2 2>&1 | tee "$GITHUB_WORKSPACE/corrected-evidence-$EXACT_CASE/build.log"
      - name: Run only the fixed diagnostic on its owned disposable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.api == 36 && 'lavapipe' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: ${{ matrix.api < 36 }}
          script: |
            adb -s emulator-5554 shell wm size ${{ matrix.api == 36 && '720x1280' || 'reset' }}
            adb -s emulator-5554 shell wm density ${{ matrix.api == 36 && '280' || 'reset' }}
            sleep 60
            bash harness/.github/run-corrected-diagnostics.sh run "$EXACT_CASE" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/corrected-evidence-$EXACT_CASE"
      - name: Reconcile exact methods, monitoring, and original diagnostic evidence
        if: always()
        run: |
          result=125
          if [[ -f "corrected-evidence-$EXACT_CASE/runner-exit.txt" ]]; then result=$(cat "corrected-evidence-$EXACT_CASE/runner-exit.txt"); fi
          python3 harness/.github/reconcile-corrected-diagnostics.py --case "$EXACT_CASE" --source "$GITHUB_WORKSPACE/source" --tooling "$GITHUB_WORKSPACE/tooling" --evidence "$GITHUB_WORKSPACE/corrected-evidence-$EXACT_CASE" --runner-exit "$result" --workflow-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve public host diagnostics
        if: always()
        run: |
          mkdir -p "corrected-evidence-$EXACT_CASE"
          { date -u +%FT%TZ; free -h; df -h; } > "corrected-evidence-$EXACT_CASE/host-final.txt" 2>&1
          sudo dmesg --ctime | tail -100 > "corrected-evidence-$EXACT_CASE/host-kernel.txt"
      - name: Retain original reports and diagnostic files, even on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: corrected-${{ matrix.case }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            corrected-evidence-${{ matrix.case }}/
            source/app/build/reports/androidTests/
            source/app/build/outputs/androidTest-results/
            source/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error
          retention-days: 14
