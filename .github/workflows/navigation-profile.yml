name: Paired navigation diagnostic (not delivery)
on:
  push:
    branches: [test/navigation-profile-20261028]
permissions:
  contents: read
concurrency:
  group: navigation-profile-20261028
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Prepare exact comparison worktrees and identical diagnostic
        run: |
          git fetch --no-tags origin ca28f49c3b50d73d47ddf06aeaaae407366fe87c 9186bf5d9a16732535a5cb11dda3e673bc299d56
          git worktree add /tmp/nav-baseline ca28f49c3b50d73d47ddf06aeaaae407366fe87c
          git worktree add /tmp/nav-candidate 9186bf5d9a16732535a5cb11dda3e673bc299d56
          for tree in /tmp/nav-baseline /tmp/nav-candidate; do
            cp app/src/androidTest/java/io/github/anastaci1a/localica/NavigationProfileTest.kt "$tree/app/src/androidTest/java/io/github/anastaci1a/localica/"
            (cd "$tree" && ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2)
          done
          mkdir -p profile-evidence
          sha256sum /tmp/nav-{baseline,candidate}/app/build/outputs/apk/{debug/*apk,androidTest/debug/*apk} > profile-evidence/apk-sha256.txt
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: false
          script: bash .github/navigation-profile.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paired-navigation-profile
          path: profile-evidence/
          if-no-files-found: error
          retention-days: 14
