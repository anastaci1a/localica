name: Perf grid cell structure bisect (diagnostic, not release)
'on':
  push:
    branches: [perf/grid-cell-structure]
permissions:
  contents: read
jobs:
  bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref:
          - ac1b46dba41b268b1f3eda684e5efe4b74d4c61f # tip
          - bc530df6a6473bb9cdc11b24fe886993b3b48214 # A1
          - fe2f85a413c05d98d01cce5dcbfe91be9709d080 # A5
          - cbc84bc9d70d3d3f0d9d60e1495b0559bcc8fcc3 # A3
          - 5d05f534539f30f72385c0c3e95d41dc07ec7af7 # A6
          - ab3db4053c0a19a80dc4ed815105be0551574daa # A4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet
      - name: Compile
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: |
            adb shell wm size reset; adb shell wm density reset
            sleep 60
            ./gradlew connectedDebugAndroidTest --no-daemon --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=io.github.anastaci1a.localica.BrowseScrollContinuityTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bisect-${{ strategy.job-index }}
          path: app/build/outputs/androidTest-results/
          retention-days: 7
