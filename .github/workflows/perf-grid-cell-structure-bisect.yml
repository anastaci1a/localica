name: Perf grid cell structure bisect (diagnostic, not release)
'on':
  push:
    branches: [perf/grid-cell-structure]
permissions:
  contents: read
jobs:
  bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base-prefix
            ref: 19c091015fd2c8a71c3a34271ffc9d807e822aae
            classes: io.github.anastaci1a.localica.ArtistAlbumFilterRangeTest,io.github.anastaci1a.localica.ArtistAlbumSelectionTest,io.github.anastaci1a.localica.ArtistCollectionActionsTest,io.github.anastaci1a.localica.ArtistSelectionPlacementTest,io.github.anastaci1a.localica.BrowseArtworkTest,io.github.anastaci1a.localica.BrowseInteractionTest,io.github.anastaci1a.localica.BrowseLoadingRevealTest,io.github.anastaci1a.localica.BrowseOrderViewportTest,io.github.anastaci1a.localica.BrowsePinchLayersTest,io.github.anastaci1a.localica.BrowsePinchTest,io.github.anastaci1a.localica.BrowsePinchTransactionTest,io.github.anastaci1a.localica.BrowsePositionTest,io.github.anastaci1a.localica.BrowseRetentionTest,io.github.anastaci1a.localica.BrowseScrollContinuityTest
          - label: tip-prefix
            ref: ac1b46dba41b268b1f3eda684e5efe4b74d4c61f
            classes: io.github.anastaci1a.localica.ArtistAlbumFilterRangeTest,io.github.anastaci1a.localica.ArtistAlbumSelectionTest,io.github.anastaci1a.localica.ArtistCollectionActionsTest,io.github.anastaci1a.localica.ArtistSelectionPlacementTest,io.github.anastaci1a.localica.BrowseArtworkTest,io.github.anastaci1a.localica.BrowseInteractionTest,io.github.anastaci1a.localica.BrowseLoadingRevealTest,io.github.anastaci1a.localica.BrowseOrderViewportTest,io.github.anastaci1a.localica.BrowsePinchLayersTest,io.github.anastaci1a.localica.BrowsePinchTest,io.github.anastaci1a.localica.BrowsePinchTransactionTest,io.github.anastaci1a.localica.BrowsePositionTest,io.github.anastaci1a.localica.BrowseRetentionTest,io.github.anastaci1a.localica.BrowseScrollContinuityTest
          - label: tip-prefix-with-cell-work
            ref: ac1b46dba41b268b1f3eda684e5efe4b74d4c61f
            classes: io.github.anastaci1a.localica.ArtistAlbumFilterRangeTest,io.github.anastaci1a.localica.ArtistAlbumSelectionTest,io.github.anastaci1a.localica.ArtistCollectionActionsTest,io.github.anastaci1a.localica.ArtistSelectionPlacementTest,io.github.anastaci1a.localica.BrowseArtworkTest,io.github.anastaci1a.localica.BrowseInteractionTest,io.github.anastaci1a.localica.BrowseLoadingRevealTest,io.github.anastaci1a.localica.BrowseOrderViewportTest,io.github.anastaci1a.localica.BrowsePinchLayersTest,io.github.anastaci1a.localica.BrowsePinchTest,io.github.anastaci1a.localica.BrowsePinchTransactionTest,io.github.anastaci1a.localica.BrowsePositionTest,io.github.anastaci1a.localica.BrowseRetentionTest,io.github.anastaci1a.localica.BrowseScrollContinuityTest,io.github.anastaci1a.localica.BrowseCellWorkTest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet
      - name: Compile
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: |
            adb shell wm size reset; adb shell wm density reset
            sleep 60
            ./gradlew connectedDebugAndroidTest --no-daemon --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=${{ matrix.classes }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bisect-${{ matrix.label }}
          path: app/build/outputs/androidTest-results/
          retention-days: 7
