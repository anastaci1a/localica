name: Glass popup motion 517 (not release)
'on':
  push:
    branches: [fix/motion-517]
permissions:
  contents: read
jobs:
  protocol_contracts:
    uses: ./.github/workflows/tooling-contracts.yml
  native:
    needs: protocol_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
            gpu: swiftshader_indirect
            disable_animations: true
            display: reset
          - api: 36
            target: default
            gpu: lavapipe
            disable_animations: false
            display: compact
    env:
      TEST_API: ${{ matrix.api }}
      SELECTORS: io.github.anastaci1a.localica.GlassMorphSubpixelTest,io.github.anastaci1a.localica.GlassMorphTest,io.github.anastaci1a.localica.GlassMorphZeroConstraintsTest,io.github.anastaci1a.localica.GlassDialogsTest,io.github.anastaci1a.localica.GlassDialogReopenTest,io.github.anastaci1a.localica.GlassDialogLateReopenTest,io.github.anastaci1a.localica.GlassMenuContentTest,io.github.anastaci1a.localica.GlassMenuForegroundTest,io.github.anastaci1a.localica.GlassMenuViewportTouchTest,io.github.anastaci1a.localica.GlassForegroundTest,io.github.anastaci1a.localica.GlassOriginPreparationTest,io.github.anastaci1a.localica.GlassPresenceTest,io.github.anastaci1a.localica.SettingsLinkMorphTest,io.github.anastaci1a.localica.PopupShadowContinuityTest,io.github.anastaci1a.localica.GlassShadowTest,io.github.anastaci1a.localica.UtilityPopupRenderDiagnosticTest,io.github.anastaci1a.localica.PopupFamilyPresentationTest,io.github.anastaci1a.localica.PopupEnvelopeTest,io.github.anastaci1a.localica.PopupScrollEdgesTest,io.github.anastaci1a.localica.GalleryMenuInputTest,io.github.anastaci1a.localica.SearchImeMotionTest,io.github.anastaci1a.localica.SearchImeHandoffObservationTest,io.github.anastaci1a.localica.ScopedSearchHistoryTest,io.github.anastaci1a.localica.ScopedSearchOpticsTest,io.github.anastaci1a.localica.SelectorPopupClearanceTest,io.github.anastaci1a.localica.NestedGlassRegistrationTest,io.github.anastaci1a.localica.GlassSilhouetteTest,io.github.anastaci1a.localica.GlassOpticsTest,io.github.anastaci1a.localica.GlassReturnCheckTest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/focused-android-setup
      - name: Check popup geometry and compile instrumentation
        run: ./gradlew testDebugUnitTest --tests io.github.anastaci1a.localica.ui.MotionPixelsTest --tests io.github.anastaci1a.localica.ui.GlassMorphPixelsTest --tests io.github.anastaci1a.localica.ui.GlassMorphGeometryTest --tests io.github.anastaci1a.localica.ui.PopupSizingTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: ${{ matrix.disable_animations }}
          script: |
            if [[ '${{ matrix.display }}' == reset ]]; then adb shell wm size reset; adb shell wm density reset; else adb shell wm size 720x1280; adb shell wm density 280; fi
            sleep 60
            bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
            bash .github/run-selection-preconditions.sh
      - name: Capture host diagnostics on emulator failure
        if: failure()
        run: |
          free -h
          df -h
          sudo dmesg --ctime | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: motion-517-api-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            selection-evidence/
            prototype-runner-environment.txt
          if-no-files-found: error
          retention-days: 14
