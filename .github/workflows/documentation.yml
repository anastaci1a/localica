name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'agents/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/RELEASE_TEMPLATE.md'
      - '.github/workflows/documentation.yml'
      - 'tools/docs/**'
      - 'fix-permissions.sh'
  pull_request:
    paths:
      - '*.md'
      - 'agents/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/RELEASE_TEMPLATE.md'
      - '.github/workflows/documentation.yml'
      - 'tools/docs/**'
      - 'fix-permissions.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/docs --ignore-scripts
      - run: npm test --prefix tools/docs
      - run: npm run check --prefix tools/docs
      - run: npm run build --prefix tools/docs
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: documentation-site
          path: build/docs-site/
          if-no-files-found: error

