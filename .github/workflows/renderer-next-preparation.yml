name: Combined renderer, cost and navigation foundation checks (not delivery)
'on':
  push:
    branches: [dev/renderer-next-preparation-20261029]
permissions:
  contents: read
jobs:
  contrast_26:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SELECTORS: io.github.anastaci1a.localica.GlassRendererPreferenceTest,io.github.anastaci1a.localica.GlassRendererSwitchingTest,io.github.anastaci1a.localica.GlassSnapshotSoftwareTest,io.github.anastaci1a.localica.FrostedSurfaceTest,io.github.anastaci1a.localica.CollectionControlsBackdropTest,io.github.anastaci1a.localica.RetainedLayerReadbackTest,io.github.anastaci1a.localica.PinchReadbackLifetimeTest,io.github.anastaci1a.localica.ToneSnapshotContinuityTest,io.github.anastaci1a.localica.SlidingTabsTest,io.github.anastaci1a.localica.SelectionLensTest,io.github.anastaci1a.localica.LyricsReturnBackdropTest,io.github.anastaci1a.localica.GlassRendererSettingsTest,io.github.anastaci1a.localica.SettingsOptionsTest,io.github.anastaci1a.localica.GlassAppearanceTest,io.github.anastaci1a.localica.ArtworkEditRestorationTest,io.github.anastaci1a.localica.PopupShadowContinuityTest,io.github.anastaci1a.localica.PopupShadowFrameExportTest,io.github.anastaci1a.localica.NavigationFrameWindowTest,io.github.anastaci1a.localica.ListDensityGeometryTest
      TEST_API: '26'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: ./.github/actions/focused-android-setup
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: true
        script: 'adb shell wm size reset

          adb shell wm density reset

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-selection-preconditions.sh

          '
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: renderer-next-preparation-api-26
        path: 'app/build/reports/

          app/build/test-results/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          selection-evidence/

          prototype-runner-environment.txt'
        if-no-files-found: error
        retention-days: 14
    name: Combined renderer foundation API26 (required, not release)
  contrast_36:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SELECTORS: io.github.anastaci1a.localica.GlassRendererPreferenceTest,io.github.anastaci1a.localica.GlassRendererSwitchingTest,io.github.anastaci1a.localica.GlassSnapshotSoftwareTest,io.github.anastaci1a.localica.FrostedSurfaceTest,io.github.anastaci1a.localica.CollectionControlsBackdropTest,io.github.anastaci1a.localica.RetainedLayerReadbackTest,io.github.anastaci1a.localica.PinchReadbackLifetimeTest,io.github.anastaci1a.localica.ToneSnapshotContinuityTest,io.github.anastaci1a.localica.SlidingTabsTest,io.github.anastaci1a.localica.SelectionLensTest,io.github.anastaci1a.localica.LyricsReturnBackdropTest,io.github.anastaci1a.localica.GlassRendererSettingsTest,io.github.anastaci1a.localica.SettingsOptionsTest,io.github.anastaci1a.localica.GlassAppearanceTest,io.github.anastaci1a.localica.ArtworkEditRestorationTest,io.github.anastaci1a.localica.PopupShadowContinuityTest,io.github.anastaci1a.localica.PopupShadowFrameExportTest,io.github.anastaci1a.localica.NavigationFrameWindowTest,io.github.anastaci1a.localica.ListDensityGeometryTest
      TEST_API: '36'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: ./.github/actions/focused-android-setup
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: false
        script: 'adb shell wm size 720x1280

          adb shell wm density 280

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-selection-preconditions.sh

          '
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: renderer-next-preparation-api-36
        path: 'app/build/reports/

          app/build/test-results/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          selection-evidence/

          prototype-runner-environment.txt'
        if-no-files-found: error
        retention-days: 14
    name: Combined renderer foundation API36 (required, not release)
