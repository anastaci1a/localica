name: Dev77 combined artwork and IME prototype (not release certified)
'on':
  push:
    branches:
    - test/dev77-combined-ime-artwork-20261029
permissions:
  contents: read
jobs:
  protocol_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Strict selector and live evidence protocol contracts
      run: 'python3 -m unittest discover -s .github/tests -p test_run_prototype_tests.py

        python3 -m unittest discover -s .github/tests -p test_observe_test_evidence.py

        python3 -m unittest discover -s .github/tests -p test_failure_context.py

        node --test .github/tests/test_publish_test_evidence.mjs

        '
  supplemental_26:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AFFECTED_CLASSES: io.github.anastaci1a.localica.ScopedSearchHistoryTest,io.github.anastaci1a.localica.TextEditingNativeImeTest
      TEST_API: '26'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Make room for emulator userdata
      run: '# This Android job does not use the runner''s preinstalled .NET SDKs.

        sudo rm -rf /usr/share/dotnet

        df -h "$HOME"

        '
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: true
        script: 'adb shell wm size reset

          adb shell wm density reset

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-prototype-tests.sh

          '
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: dev77-combined-supplemental-api-26
        path: 'app/build/reports/

          app/build/test-results/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          prototype-evidence/

          prototype-runner-environment.txt'
        if-no-files-found: error
        retention-days: 14
    name: Combined supplemental IME API26 (required, not release)
    needs: protocol_contracts
  supplemental_36:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AFFECTED_CLASSES: io.github.anastaci1a.localica.ScopedSearchHistoryTest,io.github.anastaci1a.localica.TextEditingNativeImeTest,io.github.anastaci1a.localica.FloatingImeLifecycleTest
      TEST_API: '36'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Make room for emulator userdata
      run: '# This Android job does not use the runner''s preinstalled .NET SDKs.

        sudo rm -rf /usr/share/dotnet

        df -h "$HOME"

        '
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: false
        script: 'adb shell wm size 720x1280

          adb shell wm density 280

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-prototype-tests.sh

          '
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: dev77-combined-supplemental-api-36
        path: 'app/build/reports/

          app/build/test-results/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          prototype-evidence/

          prototype-runner-environment.txt'
        if-no-files-found: error
        retention-days: 14
    name: Combined supplemental IME API36 (required, not release)
    needs: protocol_contracts
  prototype:
    needs:
    - protocol_contracts
    - supplemental_26
    - supplemental_36
    uses: ./.github/workflows/prototype.yml
    with:
      affected_classes: io.github.anastaci1a.localica.ActionStripDrawingTest,io.github.anastaci1a.localica.AdvancedRepeatTest,io.github.anastaci1a.localica.ArtistAlbumFilterRangeTest,io.github.anastaci1a.localica.ArtistAlbumSelectionTest,io.github.anastaci1a.localica.ArtistCollectionActionsTest,io.github.anastaci1a.localica.ArtistSelectionPlacementTest,io.github.anastaci1a.localica.ArtworkCropLoadingTest,io.github.anastaci1a.localica.ArtworkOccurrenceTransitionTest,io.github.anastaci1a.localica.ArtworkSwipeTest,io.github.anastaci1a.localica.ArtworkWashBorderTest,io.github.anastaci1a.localica.ArtworkWashDetailTest,io.github.anastaci1a.localica.ArtworkWashTest,io.github.anastaci1a.localica.BrowseOrderViewportTest,io.github.anastaci1a.localica.ButtonGestureTest,io.github.anastaci1a.localica.CollectionControlsBackdropTest,io.github.anastaci1a.localica.CollectionDetailTest,io.github.anastaci1a.localica.CollectionHeaderPinchFrameTest,io.github.anastaci1a.localica.CompactCollectionArtworkTest,io.github.anastaci1a.localica.DialogChromeLayoutTest,io.github.anastaci1a.localica.GlassActionRowTest,io.github.anastaci1a.localica.GlassDialogLateReopenTest,io.github.anastaci1a.localica.GlassDialogReopenTest,io.github.anastaci1a.localica.GlassDialogsTest,io.github.anastaci1a.localica.GlassMenuContentTest,io.github.anastaci1a.localica.GlassMenuViewportTouchTest,io.github.anastaci1a.localica.GlassMorphTest,io.github.anastaci1a.localica.GlassOriginPreparationTest,io.github.anastaci1a.localica.GlassShadowTest,io.github.anastaci1a.localica.IncompleteScanTest,io.github.anastaci1a.localica.InterfaceNavigationTest,io.github.anastaci1a.localica.LargeQueueTransportTest,io.github.anastaci1a.localica.LibraryDatabaseTest,io.github.anastaci1a.localica.LibraryPlaybackReadTest,io.github.anastaci1a.localica.ListBackTest,io.github.anastaci1a.localica.ListReturnControlsTest,io.github.anastaci1a.localica.ListTopFadeTest,io.github.anastaci1a.localica.LoadingMaterialOpacityTest,io.github.anastaci1a.localica.LyricsHeaderActionsTest,io.github.anastaci1a.localica.LyricsPlayerReopenTest,io.github.anastaci1a.localica.LyricsReturnBackdropTest,io.github.anastaci1a.localica.LyricsViewportMotionTest,io.github.anastaci1a.localica.PinchReadbackLifetimeTest,io.github.anastaci1a.localica.PinchReleaseHandoffTest,io.github.anastaci1a.localica.PlaybackIntentTest,io.github.anastaci1a.localica.PlayerBackdropTest,io.github.anastaci1a.localica.PlayerBackgroundPolarityTest,io.github.anastaci1a.localica.PlayerExpansionMotionTest,io.github.anastaci1a.localica.PlayerPausedSkipTest,io.github.anastaci1a.localica.PlaylistCoverActionTest,io.github.anastaci1a.localica.PlaylistDetailPresentationTest,io.github.anastaci1a.localica.PlaylistSelectionPlacementTest,io.github.anastaci1a.localica.PreparedPlayerVisualCacheTest,io.github.anastaci1a.localica.PreviousPlaybackTest,io.github.anastaci1a.localica.QueueDragAnchorTest,io.github.anastaci1a.localica.QueueFileEditTest,io.github.anastaci1a.localica.QueueFollowingTest,io.github.anastaci1a.localica.QueueInitialSaveWorkTest,io.github.anastaci1a.localica.QueueJourneyPersistenceTest,io.github.anastaci1a.localica.QueueOrderActionAdmissionTest,io.github.anastaci1a.localica.QueuePersistenceTest,io.github.anastaci1a.localica.QueueRecoveryTest,io.github.anastaci1a.localica.QueueRestoreTest,io.github.anastaci1a.localica.QueueSaveOriginTest,io.github.anastaci1a.localica.QueueSelectionPlacementTest,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest,io.github.anastaci1a.localica.RetainedLayerReadbackTest,io.github.anastaci1a.localica.ScopedSearchHistoryTest,io.github.anastaci1a.localica.SelectionLensTest,io.github.anastaci1a.localica.SettingsOptionsTest,io.github.anastaci1a.localica.SongInformationTest,io.github.anastaci1a.localica.StartupMergeTest,io.github.anastaci1a.localica.TagEditorChromeLayoutTest,io.github.anastaci1a.localica.TagEditorThemeInheritanceTest
      coverage_reason: 'Preserves the complete dev77 selected gate: 471 methods across 76 classes,

        73 affected plus three mandatory classes, with its unchanged 4022-character

        selector, finite cap73 and 4096-character limit. Integrates exact reviewed

        artwork blend-layer fixture repair and the narrow native zero-height IME

        corroboration candidate and same-snapshot native zero-bottom refinement. Both supplemental jobs must pass before the canonical

        prototype call:28 methods on API26 and29 on API36, including four new native adapter/bridge

        methods and the API36 real synthetic floating service. Distinct cross-lane

        coverage is475 methods on API26 and476 on API36; repeated mandatory methods

        are not counted twice. Full build/JVM/lint/signature, both compatibility chains,

        exact method reconciliation and complete live monitoring remain required.

        Selected prototype coverage is not complete native release certification.'
      known_issues: 'Receiver and crease isolated passes do not certify their combination with new artwork growth. Growth cannot guarantee no overlap for infeasible geometry such as 480x600 square artwork while existing trajectories stay fixed. Physical-device optical and performance acceptance remain open. Intermediate prototype, not complete latest feedback or a prerelease. Skip source 9df48e7 passed isolated run40750142858:106 native methods on each API and895 JVM; combined source still requires fresh gates. Combined source requires fresh native evidence; isolated scanner/player passes do not certify this integration. Eco remains a synthetic backing fixture, not exact S26 phone proof. Paused glyph tests inject playback state, not a complete Media3 pause/skip integration. Player foreground interpolation during artwork transition is not implemented in this slice. Native zero-height corroboration and synthetic floating compatibility are integrated, but causal repair of the original transient is unproved. Scoped result sizing does not claim a new Galaxy keyboard trajectory or unavailable initial target prediction. Lyrics continuous phase has real native readiness holds and explicit unadmitted-boundary safety settling; no universal optical or spatial-C1 continuity claim. The original false zero-height exposure and scoped-refocus failures remain retained. An unsampled intermediate native-visible-zero interval can still be a counterexample; no causal closure or waiver is claimed. Failure-context follow-on is sanitized first-failure diagnostics only, not a verdict; free-form assertions still require original XML or logs. Quick Scan is additive new-file discovery only; edits and removals still require full scan (manual or independently enabled at startup). New behavior passed isolated APIs26/36, not physical-library performance or every service cancel/restart race. Earlier synthetic grant timeout remains unexplained; passive lifecycle diagnostics preserve primary failures and unchanged time budgets. Earlier IME native failures remain preserved; no production IME fix is claimed by the separately validated ListSearch fixture pumping correction. All original hosted/native failures remain preserved, including the earlier player RenderThread/ART fatals. Equivalent shadow representation and rooted read ownership are narrow mitigations, not universal native-cause proof. The20-item ledger remains qualified:474 phone pinch closure is deferred; Header466 now has a scoped live Play/Shuffle presentation validated with actual sampling-registration, input and retained-atlas checks on API26/36. Artist carousel material remains frozen; device optical/shadow parity is unverified. The intact fallback duplicates a header atlas region: observed API26 artist offscreen ARGB estimate grows27.19 to35.70MiB, inverse31.33 to40.08MiB; these are not process-RAM measurements. Prior failed experiments remain preserved, and no universal466 closure is claimed. Equivalent horizontal selection outlines are repaired; arbitrary-shape optical parity and369 popup bands remain open. The469 continuous Queue material repair is integrated with focused checks, not universal optical/phone proof. Popup-family and header-shadow original captures remain qualified diagnostic evidence, not acceptance tests. Future dependent changes require a dependent coverage review before source freeze. Queue timings use synthetic 13000-track/100-entry data, not phone-latency or acoustic proof. Intermittent current-occurrence and busy-feedback phone reports are not closed by these contracts.473 settled single-backing sampling leaves artwork-transitioning, frozen/native-blurred/moving/partial backgrounds unavailable; atomic ink/image presentation is unproven. Font2 profile receipts are separate from unconfigured normal-suite assumptions. No blanket optical parity, universal fix, release clearance or full native pass is claimed. Every selected identity and mandatory sentinel must satisfy strict final evidence rules; known issues never waive failures, missing methods or unknown assumptions. Version, final source identity and delivery remain Lead-owned.'
