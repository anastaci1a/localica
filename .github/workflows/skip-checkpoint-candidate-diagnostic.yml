concurrency:
  cancel-in-progress: false
  group: test/skip-checkpoint-diagnostic-candidate-20261028
jobs:
  focused_36:
    env:
      AFFECTED_CLASSES: io.github.anastaci1a.localica.LargeQueueTransportTest
      TEST_API: '36'
    name: Prototype focused API 36
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Make room for emulator userdata
      run: '# This Android job does not use the runner''s preinstalled .NET SDKs.

        sudo rm -rf /usr/share/dotnet

        df -h "$HOME"

        '
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        arch: x86_64
        disable-animations: false
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072
        profile: pixel_2
        script: 'adb shell wm size 720x1280

          adb shell wm density 280

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-prototype-tests.sh

          '
        target: default
    - if: failure()
      name: Capture host diagnostics on emulator failure
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        if-no-files-found: error
        name: skip-checkpoint-candidate-api36
        path: 'app/build/reports/androidTests/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/**/utility-popup-diagnostics/**

          app/build/outputs/connected_android_test_additional_output/**/pinch-retained-highlight/**

          app/build/outputs/connected_android_test_additional_output/**/popup-shadow-continuity/**

          app/build/outputs/connected_android_test_additional_output/**/search-ime-motion/**

          app/build/outputs/connected_android_test_additional_output/**/search-slot-frames/**

          app/build/outputs/connected_android_test_additional_output/**/seek-release-handoff/**

          app/build/outputs/connected_android_test_additional_output/**/marquee-title/**

          app/build/outputs/connected_android_test_additional_output/**/player-expansion-motion/**

          app/build/outputs/connected_android_test_additional_output/**/list-top-fade-*/**

          app/build/outputs/connected_android_test_additional_output/**/complex-selection-captures/**

          app/build/outputs/connected_android_test_additional_output/**/pinch-review/**

          app/build/outputs/connected_android_test_additional_output/**/repeat386/**

          app/build/outputs/connected_android_test_additional_output/**/glass-morph-failures/**

          app/build/outputs/connected_android_test_additional_output/**/glass-shadow-failures/**

          app/build/outputs/connected_android_test_additional_output/**/loading-material-failures/**

          app/build/outputs/connected_android_test_additional_output/**/lyrics-header-actions/**

          app/build/outputs/connected_android_test_additional_output/**/list-search-return/**

          app/build/outputs/connected_android_test_additional_output/**/frosted-surface/**

          app/build/outputs/connected_android_test_additional_output/**/menu-viewport-touch/**


          prototype-evidence/

          prototype-runner-environment.txt'
    timeout-minutes: 30
name: Skip checkpoint candidate failure probe (not delivery)
'on':
  push:
    branches:
    - test/skip-checkpoint-diagnostic-candidate-20261028
permissions:
  contents: read
