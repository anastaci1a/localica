name: Quick Scan 405 isolated validation (not delivery)
'on':
  push:
    branches:
    - test/quick-scan-settings-405-20261028
permissions:
  contents: read
concurrency:
  group: quick-scan-settings-405-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quick_scan_26:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AFFECTED_CLASSES: io.github.anastaci1a.localica.IncompleteScanTest,io.github.anastaci1a.localica.StartupMergeTest,io.github.anastaci1a.localica.SettingsOptionsTest,io.github.anastaci1a.localica.LibraryDatabaseTest,io.github.anastaci1a.localica.LibraryPlaybackReadTest,io.github.anastaci1a.localica.PlaybackIntentTest
      TEST_API: '26'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Make room for emulator userdata
      run: '# This Android job does not use the runner''s preinstalled .NET SDKs.

        sudo rm -rf /usr/share/dotnet

        df -h "$HOME"

        '
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: true
        script: 'adb shell wm size reset

          adb shell wm density reset

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-prototype-tests.sh

          '
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: quick-scan-api-26
        path: 'app/build/reports/

          app/build/test-results/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          prototype-evidence/

          prototype-runner-environment.txt'
        if-no-files-found: error
        retention-days: 14
    name: Isolated Quick Scan API 26 (not delivery)
  quick_scan_36:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AFFECTED_CLASSES: io.github.anastaci1a.localica.IncompleteScanTest,io.github.anastaci1a.localica.StartupMergeTest,io.github.anastaci1a.localica.SettingsOptionsTest,io.github.anastaci1a.localica.LibraryDatabaseTest,io.github.anastaci1a.localica.LibraryPlaybackReadTest,io.github.anastaci1a.localica.PlaybackIntentTest
      TEST_API: '36'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Make room for emulator userdata
      run: '# This Android job does not use the runner''s preinstalled .NET SDKs.

        sudo rm -rf /usr/share/dotnet

        df -h "$HOME"

        '
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: false
        script: 'adb shell wm size 720x1280

          adb shell wm density 280

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-prototype-tests.sh

          '
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: quick-scan-api-36
        path: 'app/build/reports/

          app/build/test-results/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          prototype-evidence/

          prototype-runner-environment.txt'
        if-no-files-found: error
        retention-days: 14
    name: Isolated Quick Scan API 36 (not delivery)
