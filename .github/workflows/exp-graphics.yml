name: Exp graphics 544
on:
  push:
    branches: [maint/emulator-graphics-544-exp]
permissions:
  contents: read
jobs:
  exp:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    name: ${{ matrix.v.name }} r${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6]
        v:
          - {name: fix501, target: google_apis, opts: '-gpu swiftshader_indirect', cores: 2, build: '', size: reset, density: reset}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet
      - run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          target: ${{ matrix.v.target }}
          arch: x86_64
          profile: pixel_2
          cores: ${{ matrix.v.cores }}
          emulator-build: ${{ matrix.v.build }}
          emulator-options: -no-window ${{ matrix.v.opts }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.v.size }}
            adb shell wm density ${{ matrix.v.density }}
            sleep 60
            bash .github/exp-graphics.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exp-${{ matrix.v.name }}-${{ matrix.rep }}
          path: exp-out/
