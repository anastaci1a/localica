name: Native font profile gates (not delivery)
'on':
  push:
    branches: [dev/full-renderer-dev78-20261029]
permissions:
  contents: read
jobs:
  contrast_26:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: '360x640'
            pixels: '720x1280'
            selectors: 'io.github.anastaci1a.localica.DialogChromeLayoutTest#native360x640Font2RetainsSharedChromeAndEveryRepeatControl,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest#native360x640Font2SectionsExposeEveryControlAndStageDrafts,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest#native360x640PhoneFont2SectionsFitSafeInsetsWithoutWindowResize,io.github.anastaci1a.localica.TagEditorChromeLayoutTest#native360x640Font2KeepsSharedChromeAndScrollableFullSizeFields'
          - profile: '400x800'
            pixels: '800x1600'
            selectors: 'io.github.anastaci1a.localica.DialogChromeLayoutTest#native400x800Font2RetainsSharedChromeAndEveryRepeatControl,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest#native400x800Font2SectionsExposeEveryControlAndStageDrafts,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest#native400x800PhoneFont2SectionsFitSafeInsetsWithoutWindowResize'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SELECTORS: ${{ matrix.selectors }}
      TEST_API: '26'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: ./.github/actions/focused-android-setup
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: true
        script: 'adb shell wm size ${{ matrix.pixels }}

          adb shell wm density 320

          adb shell settings put system font_scale 2.0

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-selection-preconditions.sh

          '
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: font-profile-api-26-${{ matrix.profile }}
        path: 'app/build/reports/

          app/build/test-results/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          selection-evidence/

          prototype-runner-environment.txt'
        if-no-files-found: error
        retention-days: 14
    name: Font profile API26 ${{ matrix.profile }} (not release)
  contrast_36:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: '360x640'
            pixels: '720x1280'
            selectors: 'io.github.anastaci1a.localica.DialogChromeLayoutTest#native360x640Font2RetainsSharedChromeAndEveryRepeatControl,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest#native360x640Font2SectionsExposeEveryControlAndStageDrafts,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest#native360x640PhoneFont2SectionsFitSafeInsetsWithoutWindowResize,io.github.anastaci1a.localica.TagEditorChromeLayoutTest#native360x640Font2KeepsSharedChromeAndScrollableFullSizeFields'
          - profile: '400x800'
            pixels: '800x1600'
            selectors: 'io.github.anastaci1a.localica.DialogChromeLayoutTest#native400x800Font2RetainsSharedChromeAndEveryRepeatControl,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest#native400x800Font2SectionsExposeEveryControlAndStageDrafts,io.github.anastaci1a.localica.RepeatOptionsEnvelopeTest#native400x800PhoneFont2SectionsFitSafeInsetsWithoutWindowResize'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SELECTORS: ${{ matrix.selectors }}
      TEST_API: '36'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: ./.github/actions/focused-android-setup
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: false
        script: 'adb shell wm size ${{ matrix.pixels }}

          adb shell wm density 320

          adb shell settings put system font_scale 2.0

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash .github/run-selection-preconditions.sh

          '
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: font-profile-api-36-${{ matrix.profile }}
        path: 'app/build/reports/

          app/build/test-results/

          app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          selection-evidence/

          prototype-runner-environment.txt'
        if-no-files-found: error
        retention-days: 14
    name: Font profile API36 ${{ matrix.profile }} (not release)
