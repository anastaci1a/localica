name: Compose effect dispatcher 499 (not release)
'on':
  push:
    branches: [fix/compose-effect-dispatcher-499]
permissions:
  contents: read
jobs:
  protocol_contracts:
    uses: ./.github/workflows/tooling-contracts.yml
  device-tests:
    needs: protocol_contracts
    runs-on: ubuntu-24.04
    # Allow native suites plus SDK/build/emulator startup without cutting coverage.
    # Keep every test and its assertion timeout unchanged.
    timeout-minutes: 140
    env:
      RISK_CLASSES: ''
      TEST_API: ${{ matrix.api }}
      LOCALICA_LIVE_EVIDENCE: 'true'
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned live evidence publisher
        run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room for emulator userdata
        run: |
          # This Android job does not use the runner's preinstalled .NET SDKs.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Compile instrumentation APKs before starting emulator
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          # The app needs no Google services; avoid their first-boot setup on API 36.
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.api == 36 && 'lavapipe' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          # Keep API 36 system transitions at normal speed while verifying Back and DocumentsUI.
          # Its cold CI launcher stalls with forced zero-duration transitions; Compose tests own their clock.
          disable-animations: ${{ matrix.api < 36 }}
          # Preserve the Pixel 2's logical dimensions with fewer software-rendered pixels
          # on API 36. Keep real system animations and the same test assertions.
          script: |
            adb shell wm size ${{ matrix.api == 36 && '720x1280' || 'reset' }}
            adb shell wm density ${{ matrix.api == 36 && '280' || 'reset' }}
            sleep 60
            bash .github/run-device-tests.sh
      - name: Preserve native monitoring evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-live-evidence-api-${{ matrix.api }}
          path: native-live-evidence/
          if-no-files-found: error
      - name: Capture host diagnostics on emulator failure
        if: failure()
        run: |
          free -h
          df -h
          sudo dmesg --ctime | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: emulator-crashes-api-${{ matrix.api }}
          path: /tmp/android-runner/emu-crash-*/

