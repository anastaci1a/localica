name: Audit shadow and selection draw contracts (not release)
'on':
  push:
    branches: [dev/audit-selection-frame-20261030]
permissions:
  contents: read
jobs:
  protocol_contracts:
    uses: ./.github/workflows/tooling-contracts.yml
  native:
    needs: protocol_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
            gpu: swiftshader_indirect
            disable_animations: true
            display: reset
          - api: 36
            target: default
            gpu: lavapipe
            disable_animations: false
            display: compact
    env:
      TEST_API: ${{ matrix.api }}
      SELECTORS: io.github.anastaci1a.localica.GlassShadowTest,io.github.anastaci1a.localica.PopupShadowContinuityTest,io.github.anastaci1a.localica.SelectionLensTest,io.github.anastaci1a.localica.SelectionMotionRenderingTest,io.github.anastaci1a.localica.ArtistSelectionPlacementTest,io.github.anastaci1a.localica.PlaylistSelectionPlacementTest,io.github.anastaci1a.localica.QueueSelectionPlacementTest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned live evidence publisher
        run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
      - name: Record runner and toolchain identity
        run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room for emulator userdata
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Compile instrumentation and verify focused JVM contracts
        run: ./gradlew testDebugUnitTest --tests io.github.anastaci1a.localica.ui.LensGeometryTest --tests io.github.anastaci1a.localica.ui.MediaItemContourTest --tests io.github.anastaci1a.localica.ui.SelectionMotionTest --tests io.github.anastaci1a.localica.ui.SelectionDistanceFieldTest assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: ${{ matrix.disable_animations }}
          script: |
            if [[ '${{ matrix.display }}' == reset ]]; then adb shell wm size reset; adb shell wm density reset; else adb shell wm size 720x1280; adb shell wm density 280; fi
            sleep 60
            bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
            bash .github/run-selection-preconditions.sh
      - name: Capture host diagnostics on emulator failure
        if: failure()
        run: |
          free -h
          df -h
          sudo dmesg --ctime | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-shadow-selection-api-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            selection-evidence/
            prototype-runner-environment.txt
          if-no-files-found: error
          retention-days: 14
