name: ListSearch bounded virtual pump validation (not delivery)
'on':
  push:
    branches:
    - test/list-search-pump-20261028
    paths:
    - .github/workflows/list-search-pump.yml
permissions:
  contents: read
concurrency:
  group: list-search-pump-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TEST_API: ${{ matrix.api }}
      ANDROID_SERIAL: emulator-5554
      SOURCE_SHA: e35d4283a587382219d03de35ccbdd140ca2cdd6
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: e35d4283a587382219d03de35ccbdd140ca2cdd6
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"''
        | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Make room for emulator userdata
      run: '# This Android job does not use the runner''s preinstalled .NET SDKs.

        sudo rm -rf /usr/share/dotnet

        df -h "$HOME"

        '
    - name: Compile instrumentation APKs before starting emulator
      run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        mkdir evidence

        printf ''source_sha=%s\nharness_sha=%s\napi=%s\nrelease_certified=false\n''
        "$SOURCE_SHA" "$GITHUB_SHA" "$TEST_API" > evidence/context.txt

        python3 .github/test-evidence/source_methods.py --classes io.github.anastaci1a.localica.ListSearchTest
        --output evidence/expected-methods.json

        ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2

        sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        > evidence/apks.sha256

        '
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: ${{ matrix.api }}
        target: ${{ matrix.target }}
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio
          -no-boot-anim -memory 3072
        disable-animations: ${{ matrix.disable }}
        script: 'if [ "$TEST_API" = 36 ]; then adb -s emulator-5554 shell wm size
          720x1280; adb -s emulator-5554 shell wm density 280; else adb -s emulator-5554
          shell wm size reset; adb -s emulator-5554 shell wm density reset; fi

          sleep 60

          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt

          bash -c ''set -euo pipefail; test "$(git rev-parse HEAD)" = "$SOURCE_SHA";
          test "$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d
          ''"''"''\r''"''"'')" = "$TEST_API"; source .github/prepare-device-tests.sh;
          child=''"''"''''"''"''; stop_child() {   local sig=$1 code=$2;   trap ''"''"''''"''"''
          INT TERM;   if [[ -n "$child" ]]; then kill -s "$sig" "$child" 2>/dev/null
          || true; wait "$child" || true; fi;   exit "$code"; }; trap ''"''"''stop_child
          TERM 143''"''"'' TERM; trap ''"''"''stop_child INT 130''"''"'' INT; set
          +e; python3 .github/test-evidence/supervise.py --output evidence/live --run-id
          "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$SOURCE_SHA" --api
          "$TEST_API" --lane "list-pump-$TEST_API" -- ./gradlew connectedDebugAndroidTest
          --no-daemon --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=io.github.anastaci1a.localica.ListSearchTest
          & child=$!; wait "$child"; result=$?; set -e; exit "$result"''

          '
        cores: 2
        emulator-build: '16428233'
    - name: Reconcile exact class methods without skips
      run: "python3 - <<'PYXML'\nimport json, pathlib, xml.etree.ElementTree as ET\n\
        expected=set(json.loads(pathlib.Path('evidence/expected-methods.json').read_text())['runtime_methods'])\n\
        actual={}\nfor file in pathlib.Path('app/build/outputs/androidTest-results').rglob('*.xml'):\n\
        \    for case in ET.parse(file).getroot().iter('testcase'):\n        name=case.attrib['classname']+'#'+case.attrib['name']\n\
        \        if name in actual: raise SystemExit('Duplicate method '+name)\n \
        \       actual[name]='failed' if any(case.find(tag) is not None for tag in\
        \ ('failure','error','skipped')) else 'passed'\npathlib.Path('evidence/reconciled-methods.json').write_text(json.dumps(actual,indent=2)+'\\\
        n')\nif set(actual)!=expected or not actual or any(v!='passed' for v in actual.values()):\
        \ raise SystemExit('Incomplete or failing exact class')\nPYXML"
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: 'free -h

        df -h

        sudo dmesg --ctime | tail -100

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: list-pump-api${{ matrix.api }}-${{ github.run_id }}
        path: 'app/build/outputs/androidTest-results/

          app/build/outputs/connected_android_test_additional_output/

          evidence/

          prototype-runner-environment.txt

          app/src/androidTest/java/io/github/anastaci1a/localica/ListSearchTest.kt'
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
    name: ListSearch bounded pump API${{ matrix.api }} (not delivery)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - api: 26
          target: google_apis
          gpu: swiftshader_indirect
          disable: true
        - api: 36
          target: default
          gpu: lavapipe
          disable: false
