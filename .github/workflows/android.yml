name: Android

on:
  push:
    branches: [main, dev/overnight-interactions-20261019, dev/recovery-feedback-20261023, dev/aac-gapless-20261023]
    tags: ['v*.*.*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agents/**'
      - 'tools/docs/**'
      - 'fix-permissions.sh'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agents/**'
      - 'tools/docs/**'
      - 'fix-permissions.sh'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:
    inputs:
      risk_classes:
        description: Optional comma-separated instrumentation classes to run before the complete device suite
        type: string
        required: false
        default: ''
      scroll_performance:
        description: Also run the opt-in ScrollPerformanceTest measurement harness (skipped by default)
        type: boolean
        required: false
        default: false
      compatibility:
        description: Run private candidate / legacy-behavior bridge / candidate compatibility gate
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # Native shards per API; keep the device-tests matrix `shard` list at indices 0..N-1.
  LOCALICA_DEVICE_SHARDS: '8'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verification-reuse:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.find.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reuse complete exact-tree integration verification on main
        id: find
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 .github/release-verification.py select; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No eligible retained producer; run normal complete verification.'
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve the original verification identity
        if: steps.find.outputs.reused == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reused-verification
          path: verified-provenance.json
          if-no-files-found: error

  test-apks:
    # Debug app and instrumentation APKs only; the R8 distribution APK is built in parallel by `build`.
    needs: verification-reuse
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && needs.verification-reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      test-apks-sha256: ${{ steps.test-apks.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore development signing key
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          KEYSTORE_PATH: ${{ runner.temp }}/localica-debug.keystore
        run: |
          test -n "$DEBUG_KEYSTORE"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build and check
        # Test APK producers only; unit tests and lint run in static-checks, the R8 APK in build.
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=4 -Dorg.gradle.jvmargs='-Xmx6g -Dfile.encoding=UTF-8'
      - name: Freeze shared instrumentation APKs
        id: test-apks
        run: echo "sha256=$(python3 .github/shared-test-apks.py freeze --output native-test-apks)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-test-apks
          path: native-test-apks/
          if-no-files-found: error

  build:
    needs: verification-reuse
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && needs.verification-reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      delivery-apk-sha256: ${{ steps.delivery-apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore development signing key
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          KEYSTORE_PATH: ${{ runner.temp }}/localica-debug.keystore
        run: |
          test -n "$DEBUG_KEYSTORE"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build and check
        # The R8 delivery APK only; the debug/instrumentation APKs come from test-apks, and unit tests and lint from static-checks.
        run: ./gradlew assembleDistribution --no-daemon --max-workers=4 -Dorg.gradle.jvmargs='-Xmx6g -Dfile.encoding=UTF-8'
      - name: Publish the optimized distribution APK as the canonical artifact
        run: |
          out=app/build/outputs/apk
          ls -l "$out/distribution/app-distribution.apk"
          mkdir -p "$out/debug"
          cp "$out/distribution/app-distribution.apk" "$out/debug/app-debug.apk"
      - name: Verify the artifact is not debuggable
        run: bash .github/verify-non-debuggable.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Verify development signing certificate
        if: github.event_name != 'pull_request'
        run: |
          expected=$(keytool -exportcert -alias androiddebugkey -keystore "$LOCALICA_DEBUG_KEYSTORE" -storepass android | sha256sum | cut -d ' ' -f 1)
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$expected" = "$actual"
      - name: Record verified APK checksum
        id: delivery-apk
        working-directory: app/build/outputs/apk/debug
        run: |
          sha256sum app-debug.apk > app-debug.apk.sha256
          echo "sha256=$(cut -d ' ' -f 1 app-debug.apk.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localica-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/

  static-checks:
    # Unit tests, lint and the release variant, off the APK critical path. The summary and
    # release-verification.py require this job alongside build and the device shards.
    needs: verification-reuse
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && needs.verification-reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore development signing key
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          KEYSTORE_PATH: ${{ runner.temp }}/localica-debug.keystore
        run: |
          test -n "$DEBUG_KEYSTORE"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Unit tests, lint and release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon --max-workers=4 -Dorg.gradle.jvmargs='-Xmx6g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: static-check-reports
          path: app/build/reports/

  device-tests:
    needs: test-apks
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    # Normal shards take 13–19 minutes; bound hangs without trimming coverage.
    timeout-minutes: 35
    env:
      RISK_CLASSES: ${{ github.event_name == 'workflow_dispatch' && inputs.risk_classes || '' }}
      TEST_API: ${{ matrix.api }}
      LOCALICA_SHARD_INDEX: ${{ matrix.shard }}
      LOCALICA_SCROLL_PERFORMANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.scroll_performance && 'true' || '' }}
      LOCALICA_LIVE_EVIDENCE: 'true'
      LOCALICA_PREBUILT_TEST_APKS: 'true'
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned live evidence publisher
        run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room for emulator userdata
        run: |
          # This Android job does not use the runner's preinstalled .NET SDKs.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-test-apks
          path: native-test-apks
      - name: Verify and install shared instrumentation APKs
        env:
          TEST_APKS_SHA256: ${{ needs.test-apks.outputs.test-apks-sha256 }}
        run: |
          python3 .github/shared-test-apks.py verify --bundle native-test-apks --digest "$TEST_APKS_SHA256"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          # The app needs no Google services; avoid their first-boot setup on API 36.
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.api == 36 && 'lavapipe' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -memory 3072 -show-kernel ${{ matrix.api == 26 && '-feature -GLDMA' || '' }}
          # Keep API 36 system transitions at normal speed while verifying Back and DocumentsUI.
          # Its cold CI launcher stalls with forced zero-duration transitions; Compose tests own their clock.
          disable-animations: ${{ matrix.api < 36 }}
          # Preserve the Pixel 2's logical dimensions with fewer software-rendered pixels
          # on API 36. Keep real system animations and the same test assertions.
          script: |
            adb shell wm size ${{ matrix.api == 36 && '720x1280' || 'reset' }}
            adb shell wm density ${{ matrix.api == 36 && '280' || 'reset' }}
            sleep 60
            LOCALICA_SHARD_COUNT=$LOCALICA_DEVICE_SHARDS bash .github/run-device-tests.sh
      - name: Preserve native monitoring evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-live-evidence-api-${{ matrix.api }}-shard-${{ matrix.shard }}
          path: native-live-evidence/
          if-no-files-found: error
      - name: Preserve focused preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.risk_classes != ''
        with:
          name: preflight-reports-api-${{ matrix.api }}-shard-${{ matrix.shard }}
          path: preflight-reports/
      - name: Capture host diagnostics on emulator failure
        if: failure()
        run: |
          free -h
          df -h
          sudo dmesg --ctime | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}-shard-${{ matrix.shard }}
          path: |
            native-shard-plan.json
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: emulator-crashes-api-${{ matrix.api }}-shard-${{ matrix.shard }}
          path: /tmp/android-runner/emu-crash-*/
          if-no-files-found: warn


  device-tests-summary:
    # Proves the shards ran every inventory test exactly once. The tag release job checks this job
    # by name instead of the individual shard jobs.
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && needs.verification-reuse.outputs.reused != 'true' }}
    needs: [device-tests, test-apks, build, static-checks, verification-reuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-reports-api-*-shard-*'
          path: shard-reports
      - name: Verify the shard union equals the source inventory
        run: |
          set -uo pipefail
          status=0
          for api in 26 36; do
            args=()
            count=0
            for dir in shard-reports/device-reports-api-$api-shard-*; do
              [ -d "$dir" ] || continue
              count=$((count + 1))
            done
            test "$count" = "$LOCALICA_DEVICE_SHARDS" || { echo "API $api: $count of $LOCALICA_DEVICE_SHARDS shard reports" >&2; status=1; continue; }
            while IFS= read -r dir; do args+=(--xml-root "$dir"); done < <(find shard-reports -type d -name androidTest-results -path "*-reports-api-$api-shard-*" | sort)
            python3 .github/test-evidence/full_partition.py union --root "$PWD" --api "$api" --shards "$LOCALICA_DEVICE_SHARDS" "${args[@]}" | tee "union-api-$api.json" || status=1
          done
          exit $status
      # A timed-out shard makes the matrix result non-success, even if XML is complete.
      - name: Require every shard job to have succeeded
        if: always()
        run: |
          test "${{ needs.device-tests.result }}" = success
          test "${{ needs.static-checks.result }}" = success

      - name: Record complete verification provenance
        env:
          DELIVERY_APK_SHA256: ${{ needs.build.outputs.delivery-apk-sha256 }}
        run: python3 .github/release-verification.py record --apk-sha256 "$DELIVERY_APK_SHA256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-verification
          path: |
            verification.json
            union-api-26.json
            union-api-36.json
          if-no-files-found: error

  compatibility:
    needs: verification-reuse
    if: ${{ needs.verification-reuse.outputs.reused != 'true' && ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev/overnight-interactions-20261019' || github.ref == 'refs/heads/dev/recovery-feedback-20261023' || github.ref == 'refs/heads/dev/aac-gapless-20261023') && github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.compatibility) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore existing development signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          KEYSTORE_PATH: ${{ runner.temp }}/compatibility-debug.keystore
        run: |
          test -n "$DEBUG_KEYSTORE"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Prepare isolated exact-SHA compatibility archives
        run: python3 .github/compatibility/prepare.py
      - name: Enable emulator acceleration and make room
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet
      - name: Build and inspect private compatibility APKs sequentially
        run: bash .github/compatibility/build.sh
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.api == 36 && 'lavapipe' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -memory 3072 ${{ matrix.api == 26 && '-feature -GLDMA' || '' }}
          disable-animations: ${{ matrix.api < 36 }}
          script: |
            adb shell wm size ${{ matrix.api == 36 && '720x1280' || 'reset' }}
            adb shell wm density ${{ matrix.api == 36 && '280' || 'reset' }}
            sleep 60
            bash .github/compatibility/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-reports-api-${{ matrix.api }}
          path: ${{ runner.temp }}/shuffle-compatibility/reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-seed-app-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/seed/compatibility-seed-app.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/seed/compatibility-seed-app.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-seed-test-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/seed/compatibility-seed-test.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/seed/compatibility-seed-test.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-bridge-app-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/bridge/compatibility-bridge-app.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/bridge/compatibility-bridge-app.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-bridge-test-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/bridge/compatibility-bridge-test.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/bridge/compatibility-bridge-test.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-verify-app-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/verify/compatibility-verify-app.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/verify/compatibility-verify-app.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-verify-test-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/verify/compatibility-verify-test.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/verify/compatibility-verify-test.apk.sha256
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Find complete successful verification for the exact release tree
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release-verification.py select
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localica-debug
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run-id }}
      - name: Check release version and signing identity
        env:
          VERIFIED_APK_SHA256: ${{ steps.verified.outputs.apk-sha256 }}
        run: |
          bash .github/verify-non-debuggable.sh artifacts/app-debug.apk
          (cd artifacts && sha256sum --check app-debug.apk.sha256)
          test "$(sha256sum artifacts/app-debug.apk | cut -d ' ' -f 1)" = "$VERIFIED_APK_SHA256"
          mv artifacts/app-debug.apk.sha256 verified-apk.sha256
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/app-debug.apk > apk-badging.txt
          version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" apk-badging.txt)
          test "$GITHUB_REF_NAME" = "v$version"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = 'b18a3e7bf9eebd67d6eb2ebc0f2374aba803e17e9e89d6647792433937037827'
          test "$(head -n 1 .github/RELEASE_NOTES.md)" = "<!-- Release: $GITHUB_REF_NAME -->"
          if grep -q '{{' .github/RELEASE_NOTES.md; then
            echo 'Fill all release-note placeholders before tagging.' >&2
            exit 1
          fi
      - name: Preserve release verification provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-provenance
          path: verified-provenance.json
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/net/jthink/jaudiotagger/3.0.1/jaudiotagger-3.0.1-sources.jar -o artifacts/jaudiotagger-3.0.1-sources.jar
          echo 'd9c79a145944e6bc37579403843c9da84cd81459e42c9877351802ee284f5858  artifacts/jaudiotagger-3.0.1-sources.jar' | sha256sum --check
          mv artifacts/app-debug.apk "artifacts/localica-$GITHUB_REF_NAME-debug.apk"
          cd artifacts
          sha256sum "localica-$GITHUB_REF_NAME-debug.apk" > "localica-$GITHUB_REF_NAME-debug.apk.sha256"
          gh release create "$GITHUB_REF_NAME" *.apk *.sha256 *.jar --verify-tag \
            --title "localica $GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES.md"

  distribution-smoke:
    # Exercises the exact R8 distribution APK that the build job publishes and the release job ships.
    # The tag release job cannot list this in `needs` (build is skipped on tags); it checks the
    # main run's job conclusions by name instead.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localica-debug
          path: artifacts
      - name: Verify the downloaded APK
        env:
          VERIFIED_APK_SHA256: ${{ needs.build.outputs.delivery-apk-sha256 }}
        run: |
          (cd artifacts && sha256sum --check app-debug.apk.sha256)
          test "$(sha256sum artifacts/app-debug.apk | cut -d ' ' -f 1)" = "$VERIFIED_APK_SHA256"
          bash .github/verify-non-debuggable.sh artifacts/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.api == 36 && 'lavapipe' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -memory 3072 ${{ matrix.api == 26 && '-feature -GLDMA' || '' }}
          disable-animations: ${{ matrix.api < 36 }}
          script: |
            adb shell wm size ${{ matrix.api == 36 && '720x1280' || 'reset' }}
            adb shell wm density ${{ matrix.api == 36 && '280' || 'reset' }}
            sleep 60
            bash .github/distribution-smoke.sh artifacts/app-debug.apk distribution-smoke-logcat.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: distribution-smoke-logcat-api-${{ matrix.api }}
          path: distribution-smoke-logcat*.txt
          if-no-files-found: warn
