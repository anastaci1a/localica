name: Android

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore development signing key
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          test -n "$DEBUG_KEYSTORE"
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build and check
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=$(jq -r '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localica-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/

  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room for emulator userdata
        run: |
          # This Android job does not use the runner's preinstalled .NET SDKs.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, device-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localica-debug
          path: artifacts
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv artifacts/app-debug.apk "artifacts/localica-$GITHUB_REF_NAME-debug.apk"
          cd artifacts
          sha256sum "localica-$GITHUB_REF_NAME-debug.apk" > "localica-$GITHUB_REF_NAME-debug.apk.sha256"
          gh release create "$GITHUB_REF_NAME" *.apk *.sha256 --verify-tag --prerelease \
            --title "localica $GITHUB_REF_NAME" --generate-notes \
            --notes 'Development APK for Android 8 or newer. Signed with the project development key; uses a separate .debug application ID. Production distribution signing is not configured.'
