name: Android

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agents/**'
      - 'tools/docs/**'
      - 'fix-permissions.sh'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agents/**'
      - 'tools/docs/**'
      - 'fix-permissions.sh'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:
    inputs:
      risk_classes:
        description: Optional comma-separated instrumentation classes to run before the complete device suite
        type: string
        required: false
        default: ''
      compatibility:
        description: Run private candidate / legacy-behavior bridge / candidate compatibility gate
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore development signing key
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          KEYSTORE_PATH: ${{ runner.temp }}/localica-debug.keystore
        run: |
          test -n "$DEBUG_KEYSTORE"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build and check
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - name: Verify development signing certificate
        if: github.event_name != 'pull_request'
        run: |
          expected=$(keytool -exportcert -alias androiddebugkey -keystore "$LOCALICA_DEBUG_KEYSTORE" -storepass android | sha256sum | cut -d ' ' -f 1)
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$expected" = "$actual"
      - name: Record verified APK checksum
        working-directory: app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localica-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/

  device-tests:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    # API 26 needs ~33 minutes for the suite alone; include SDK/build/emulator startup.
    # Keep every test and its assertion timeout unchanged.
    timeout-minutes: 60
    env:
      RISK_CLASSES: ${{ github.event_name == 'workflow_dispatch' && inputs.risk_classes || '' }}
      TEST_API: ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room for emulator userdata
        run: |
          # This Android job does not use the runner's preinstalled .NET SDKs.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Compile instrumentation APKs before starting emulator
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          # The app needs no Google services; avoid their first-boot setup on API 36.
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.api == 36 && 'lavapipe' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          # Keep API 36 system transitions at normal speed while verifying Back and DocumentsUI.
          # Its cold CI launcher stalls with forced zero-duration transitions; Compose tests own their clock.
          disable-animations: ${{ matrix.api < 36 }}
          # Preserve the Pixel 2's logical dimensions with fewer software-rendered pixels
          # on API 36. Keep real system animations and the same test assertions.
          script: |
            adb shell wm size ${{ matrix.api == 36 && '720x1280' || 'reset' }}
            adb shell wm density ${{ matrix.api == 36 && '280' || 'reset' }}
            sleep 60
            bash .github/run-device-tests.sh
      - name: Preserve focused preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.risk_classes != ''
        with:
          name: preflight-reports-api-${{ matrix.api }}
          path: preflight-reports/
      - name: Capture host diagnostics on emulator failure
        if: failure()
        run: |
          free -h
          df -h
          sudo dmesg --ctime | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/**/utility-popup-diagnostics/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: emulator-crashes-api-${{ matrix.api }}
          path: /tmp/android-runner/emu-crash-*/

  compatibility:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.compatibility }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore existing development signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          KEYSTORE_PATH: ${{ runner.temp }}/compatibility-debug.keystore
        run: |
          test -n "$DEBUG_KEYSTORE"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Prepare isolated exact-SHA compatibility archives
        run: python3 .github/compatibility/prepare.py
      - name: Enable emulator acceleration and make room
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet
      - name: Build and inspect private compatibility APKs sequentially
        run: bash .github/compatibility/build.sh
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.api == 36 && 'lavapipe' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: ${{ matrix.api < 36 }}
          script: |
            adb shell wm size ${{ matrix.api == 36 && '720x1280' || 'reset' }}
            adb shell wm density ${{ matrix.api == 36 && '280' || 'reset' }}
            sleep 60
            bash .github/compatibility/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-reports-api-${{ matrix.api }}
          path: ${{ runner.temp }}/shuffle-compatibility/reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-seed-app-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/seed/compatibility-seed-app.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/seed/compatibility-seed-app.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-seed-test-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/seed/compatibility-seed-test.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/seed/compatibility-seed-test.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-bridge-app-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/bridge/compatibility-bridge-app.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/bridge/compatibility-bridge-app.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-bridge-test-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/bridge/compatibility-bridge-test.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/bridge/compatibility-bridge-test.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-verify-app-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/verify/compatibility-verify-app.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/verify/compatibility-verify-app.apk.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-verify-test-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/shuffle-compatibility/apks/verify/compatibility-verify-test.apk
            ${{ runner.temp }}/shuffle-compatibility/apks/verify/compatibility-verify-test.apk.sha256
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Find successful verification for the tagged commit
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs" \
            -f head_sha="$commit" -f branch=main -f event=push -f per_page=100 \
            --jq '.workflow_runs | map(select(.head_branch == "main" and .event == "push")) | first | .id // empty')
          if [ -z "$run_id" ]; then
            echo 'No main verification for this commit. Finish its checks, then rerun this release job.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > verified-run.json
          jq -e --arg commit "$commit" '.head_sha == $commit and .head_branch == "main" and .event == "push" and .conclusion == "success"' verified-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > verified-jobs.json
          jq -e '["build", "device-tests (26)", "device-tests (36)", "compatibility (26)", "compatibility (36)"] - [.jobs[] | select(.conclusion == "success") | .name] | length == 0' verified-jobs.json
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: localica-debug
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run-id }}
      - name: Check release version and signing identity
        run: |
          (cd artifacts && sha256sum --check app-debug.apk.sha256)
          mv artifacts/app-debug.apk.sha256 verified-apk.sha256
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/app-debug.apk > apk-badging.txt
          version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" apk-badging.txt)
          test "$GITHUB_REF_NAME" = "v$version"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = 'b18a3e7bf9eebd67d6eb2ebc0f2374aba803e17e9e89d6647792433937037827'
          test "$(head -n 1 .github/RELEASE_NOTES.md)" = "<!-- Release: $GITHUB_REF_NAME -->"
          if grep -q '{{' .github/RELEASE_NOTES.md; then
            echo 'Fill all release-note placeholders before tagging.' >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/net/jthink/jaudiotagger/3.0.1/jaudiotagger-3.0.1-sources.jar -o artifacts/jaudiotagger-3.0.1-sources.jar
          echo 'd9c79a145944e6bc37579403843c9da84cd81459e42c9877351802ee284f5858  artifacts/jaudiotagger-3.0.1-sources.jar' | sha256sum --check
          mv artifacts/app-debug.apk "artifacts/localica-$GITHUB_REF_NAME-debug.apk"
          cd artifacts
          sha256sum "localica-$GITHUB_REF_NAME-debug.apk" > "localica-$GITHUB_REF_NAME-debug.apk.sha256"
          gh release create "$GITHUB_REF_NAME" *.apk *.sha256 *.jar --verify-tag \
            --title "localica $GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES.md"
