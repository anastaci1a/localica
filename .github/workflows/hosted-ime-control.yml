# Unbound template: bind only after an independently read-back test-only source child.
# Publishing to the exact opt-in branch starts execution; this package does neither.
# Opt-in diagnostics only: no release gate, compatibility, production, or canonical APK delivery/signing changes.
name: Hosted Search IME retirement diagnostic (not release evidence)
'on':
  push:
    branches: [test/hosted-ime-control-20261027]
    paths:
      - .github/workflows/hosted-ime-control.yml
      - .github/run-ime-control.sh
      - .github/reconcile-ime-control.py
      - .github/ime_control_contract.py
      - .github/ime_environment.py

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: hosted-ime-control-diagnostic-${{ github.ref }}
  # Do not silently cancel a run or discard its first failure on a later push.
  cancel-in-progress: false

jobs:
  exact:
    name: Search IME retirement ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: baseline-class
            api: 36
            gpu: lavapipe
            disable_animations: false
            source: 77314e80885f4649d58482991ac3e2f9898b7d8a
          - case: native-nonempty
            api: 36
            gpu: lavapipe
            disable_animations: false
            source: 35e58219a27e4fe184ac8c9d90a8a38fd7580ad1
          - case: native-resize
            api: 36
            gpu: lavapipe
            disable_animations: false
            source: 35e58219a27e4fe184ac8c9d90a8a38fd7580ad1
          - case: noobserver-nonempty
            api: 36
            gpu: lavapipe
            disable_animations: false
            source: 35e58219a27e4fe184ac8c9d90a8a38fd7580ad1
          - case: noobserver-resize
            api: 36
            gpu: lavapipe
            disable_animations: false
            source: 35e58219a27e4fe184ac8c9d90a8a38fd7580ad1
    env:
      EXACT_CASE: ${{ matrix.case }}
      TEST_API: ${{ matrix.api }}
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Checkout diagnostic harness at the event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          sparse-checkout: .github
      - name: Checkout immutable test source (never overlay tests)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
          path: source
          # Verify source child, integrated commit, and its sole base parent.
          fetch-depth: 3
          persist-credentials: false
      - name: Checkout immutable monitoring and device-ownership helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1e31403cb042e9896686200a4800faffce9b2a59
          path: tooling
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          # Use the original prototype's supported major selector, not java -version text.
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Create fresh immutable provenance and source method inventory
        run: bash harness/.github/run-ime-control.sh prepare "$EXACT_CASE" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/ime-control-evidence-$EXACT_CASE"
      - name: Capture actual Java 17 identity (not patch equivalence)
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / ('ime-control-evidence-' + os.environ['EXACT_CASE'])
          raw_path = root / 'java-identity.txt'
          command = ['java', '-XshowSettings:properties', '-version']
          with raw_path.open('xb') as output:
              subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=30, check=True)
          raw = raw_path.read_bytes()
          text = raw.decode()
          majors = re.findall(r'^\s*java\.specification\.version = (\S+)\s*$', text, re.M)
          versions = re.findall(r'^\s*java\.version = (\S+)\s*$', text, re.M)
          if majors != ['17'] or len(versions) != 1 or not re.fullmatch(r'17(?:\.[0-9]+)*(?:[+_-][A-Za-z0-9.+_-]+)?', versions[0]):
              raise SystemExit('Requires one unambiguous Java 17 runtime identity; inspect java-identity.txt')
          receipt = dict(requested_selector='17', required_major=17, actual_version=versions[0],
              command=command, raw_sha256=hashlib.sha256(raw).hexdigest(),
              exact_patch_equivalence=False, full_environment_equivalence=False)
          with (root / 'java-identity.json').open('x') as output:
              json.dump(receipt, output, indent=2); output.write('\n')
          PY
      - name: Install the pinned live evidence publisher
        run: npm ci --prefix tooling/.github/test-evidence --ignore-scripts --no-audit --no-fund
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make room for disposable emulator userdata
        run: |
          # This diagnostic Android job does not use the preinstalled .NET SDKs.
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Compile the exact test inputs before emulator startup
        working-directory: source
        run: |
          # Isolated runner-generated debug signing only; never a canonical keystore.
          env -u LOCALICA_DEBUG_KEYSTORE ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2 2>&1 | tee "$GITHUB_WORKSPACE/ime-control-evidence-$EXACT_CASE/build.log"
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > "$GITHUB_WORKSPACE/ime-control-evidence-$EXACT_CASE/build-input-apks.sha256"
          printf '%s\n' 'UNVALIDATED DIAGNOSTIC DEBUG INPUTS. Disposable runner debug signing; not canonical delivery, release certification, or a full-suite pass.' > "$GITHUB_WORKSPACE/ime-control-evidence-$EXACT_CASE/APK-STATUS.txt"
      - name: Run only the fixed selector and control arm on its owned disposable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          emulator-build: 16428233
          cores: 2
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: ${{ matrix.disable_animations }}
          script: |
            adb -s emulator-5554 shell wm size reset
            adb -s emulator-5554 shell wm density reset
            if [ "$TEST_API" = 36 ]; then adb -s emulator-5554 shell wm size 720x1280 || exit $?; adb -s emulator-5554 shell wm density 280 || exit $?; for key in animator_duration_scale transition_animation_scale window_animation_scale; do adb -s emulator-5554 shell settings put global "$key" 1 || exit $?; done; fi
            sleep 60
            bash harness/.github/run-ime-control.sh run "$EXACT_CASE" "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/ime-control-evidence-$EXACT_CASE"
      - name: Reconcile exact methods, controls, monitoring, and original timelines
        if: always()
        run: |
          result=125
          if [[ -f "ime-control-evidence-$EXACT_CASE/runner-exit.txt" ]]; then result=$(cat "ime-control-evidence-$EXACT_CASE/runner-exit.txt"); fi
          python3 harness/.github/reconcile-ime-control.py --case "$EXACT_CASE" --source "$GITHUB_WORKSPACE/source" --tooling "$GITHUB_WORKSPACE/tooling" --evidence "$GITHUB_WORKSPACE/ime-control-evidence-$EXACT_CASE" --runner-exit "$result" --workflow-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve public host diagnostics
        if: always()
        run: |
          mkdir -p "ime-control-evidence-$EXACT_CASE"
          { date -u +%FT%TZ; free -h; df -h; } > "ime-control-evidence-$EXACT_CASE/host-final.txt" 2>&1
          sudo dmesg --ctime | tail -100 > "ime-control-evidence-$EXACT_CASE/host-kernel.txt"
      - name: Retain original reports and diagnostic files, even on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ime-control-${{ matrix.case }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ime-control-evidence-${{ matrix.case }}/
            source/app/build/reports/androidTests/
            source/app/build/outputs/androidTest-results/
            source/app/build/outputs/connected_android_test_additional_output/
            source/app/build/outputs/apk/debug/app-debug.apk
            source/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            source/app/src/androidTest/java/io/github/anastaci1a/localica/SearchImeMotionTest.kt
            source/app/src/androidTest/java/io/github/anastaci1a/localica/SearchImeRetirementProbe.kt
            harness/.github/workflows/hosted-ime-control.yml
            harness/.github/run-ime-control.sh
            harness/.github/reconcile-ime-control.py
            harness/.github/ime_control_contract.py
            harness/.github/ime_environment.py
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
