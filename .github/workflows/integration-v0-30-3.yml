name: Integration v0.30.3 focused gates (not release)
'on':
  push:
    branches: [integration/v0.30.3]
permissions:
  contents: read
jobs:
  protocol_contracts:
    uses: ./.github/workflows/tooling-contracts.yml
  native:
    needs: protocol_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
            gpu: swiftshader_indirect
            disable_animations: true
            display: reset
          - api: 36
            target: default
            gpu: lavapipe
            disable_animations: false
            display: compact
    env:
      TEST_API: ${{ matrix.api }}
      SELECTORS: io.github.anastaci1a.localica.FarScrollScrollbarTest,io.github.anastaci1a.localica.ListControlsTest,io.github.anastaci1a.localica.ArtworkCacheConcurrencyTest,io.github.anastaci1a.localica.ArtworkCacheSizingTest,io.github.anastaci1a.localica.ArtworkCacheTest,io.github.anastaci1a.localica.ArtworkCropLoadingTest,io.github.anastaci1a.localica.ArtworkCropTest,io.github.anastaci1a.localica.ArtworkEditRestorationTest,io.github.anastaci1a.localica.ArtworkGrantsTest,io.github.anastaci1a.localica.ArtworkOccurrenceTransitionTest,io.github.anastaci1a.localica.ArtworkRevealTest,io.github.anastaci1a.localica.ArtworkReviewReadinessTest,io.github.anastaci1a.localica.ArtworkStaggerTest,io.github.anastaci1a.localica.ArtworkSwipeTest,io.github.anastaci1a.localica.ArtworkOffMainTest,io.github.anastaci1a.localica.ArtworkViewerGestureTest,io.github.anastaci1a.localica.ArtworkWashBorderTest,io.github.anastaci1a.localica.ArtworkWashDetailTest,io.github.anastaci1a.localica.ArtworkWashTest,io.github.anastaci1a.localica.GlassRendererSettingsTest,io.github.anastaci1a.localica.GlassRendererPreferenceTest,io.github.anastaci1a.localica.SettingsOptionsTest,io.github.anastaci1a.localica.GlassAppearanceTest,io.github.anastaci1a.localica.InterfaceControlsTest,io.github.anastaci1a.localica.SliderSwitchHapticsTest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/focused-android-setup
      - name: Compile and run the shadow strength unit tests
        run: ./gradlew testDebugUnitTest --tests io.github.anastaci1a.localica.ui.GlassShadowStrengthCurveTest --tests io.github.anastaci1a.localica.ui.GlassBackendTest assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: ${{ matrix.disable_animations }}
          script: |
            if [[ '${{ matrix.display }}' == reset ]]; then adb shell wm size reset; adb shell wm density reset; else adb shell wm size 720x1280; adb shell wm density 280; fi
            sleep 60
            bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
            bash .github/run-selection-preconditions.sh
      - name: Capture host diagnostics on emulator failure
        if: failure()
        run: |
          free -h
          df -h
          sudo dmesg --ctime | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-v0-30-3-api-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            selection-evidence/
            prototype-runner-environment.txt
          if-no-files-found: error
          retention-days: 14
