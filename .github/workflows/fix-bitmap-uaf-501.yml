name: Bitmap 501 BrowseArtwork base comparison (not release)
'on':
  push:
    branches: [fix/bitmap-uaf-501]
permissions:
  contents: read
jobs:
  protocol_contracts:
    uses: ./.github/workflows/tooling-contracts.yml
  native:
    needs: protocol_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            source: ef404fb3708cb71a5fbbb7e09923aae594cb9742
          - variant: candidate
            source: d5f1e40ca93218c926cf801104a8b604a369b2b4
    env:
      TEST_API: 26
      SOURCE_SHA: ${{ matrix.source }}
      SELECTORS: io.github.anastaci1a.localica.BrowseArtworkTest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
      - name: Bind workflow and tested source separately
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'workflow_sha=%s\ntested_sha=%s\nvariant=%s\n' "$GITHUB_SHA" "$SOURCE_SHA" '${{ matrix.variant }}' > comparison-identity.txt
      - uses: ./.github/actions/focused-android-setup
      - name: Compile isolated BrowseArtwork contracts
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: |
            adb shell wm size reset; adb shell wm density reset
            sleep 60
            bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
            GITHUB_SHA="$SOURCE_SHA" bash .github/run-selection-preconditions.sh
      - name: Capture host diagnostics on emulator failure
        if: failure()
        run: |
          free -h
          df -h
          sudo dmesg --ctime | tail -100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bitmap-501-browse-${{ matrix.variant }}-api-26
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            selection-evidence/
            prototype-runner-environment.txt
            comparison-identity.txt
          if-no-files-found: error
          retention-days: 14
