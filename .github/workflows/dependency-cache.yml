# Warms the shared Gradle dependency caches that every hosted compile job restores (#681).
# Entries saved from main are visible to every branch; a dispatch on a branch serves only that branch.
name: Dependency cache
'on':
  workflow_dispatch:
  push:
    branches: [main, fix/ci-dependency-cache-681]
    paths:
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/dependency-cache.yml'
permissions:
  contents: read
concurrency:
  group: dependency-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static-checks:
    # Writer for prototype `build` and Android `static-checks`: unit tests, lint, debug and release assembly.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: localica-static-checks
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false
      - name: Record restored dependency files
        run: bash .github/dependency-cache-audit.sh snapshot
      - name: Resolve the static-checks task set
        # The same tasks and sizing as the prototype build job (a superset of Android static-checks).
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --max-workers=4 -Dorg.gradle.jvmargs='-Xmx6g -Dfile.encoding=UTF-8'
      - name: Record downloaded dependency files
        if: ${{ !cancelled() }}
        run: bash .github/dependency-cache-audit.sh report
  test-apks:
    # Writer for the focused and compatibility jobs and Android `test-apks`: debug app and instrumentation APKs.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: localica-test-apks
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false
      - name: Record restored dependency files
        run: bash .github/dependency-cache-audit.sh snapshot
      - name: Resolve the test-apks task set
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=4 -Dorg.gradle.jvmargs='-Xmx6g -Dfile.encoding=UTF-8'
      - name: Record downloaded dependency files
        if: ${{ !cancelled() }}
        run: bash .github/dependency-cache-audit.sh report
