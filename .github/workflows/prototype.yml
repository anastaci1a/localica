# Manual development builds only. Existing Android release gates remain unchanged.
name: Prototype (not release certified)
'on':
  workflow_dispatch:
    inputs:
      repeat:
        description: Independent iterations of the complete selected gate (1-30); stops on first failure
        required: false
        default: 1
        type: number
      repeat_methods:
        description: Optional comma-separated Class#method witnesses; mandatory regressions run once before these repetitions
        required: false
        default: ''
        type: string
      affected_classes:
        description: Comma-separated affected behavior test classes; IME, focus and contrast regressions are added automatically
        required: true
        type: string
      coverage_reason:
        description: What changed and why these classes cover it
        required: true
        type: string
      known_issues:
        description: Disclosed limitations; never waives a failing required check
        required: false
        default: ''
        type: string
      runner:
        description: Where the focused emulator jobs run; self-hosted is the owner's locked-down JIT runner (#592)
        required: false
        default: hosted
        type: choice
        options:
        - hosted
        - self-hosted
  workflow_call:
    inputs:
      repeat:
        description: Independent iterations of the complete selected gate (1-30); stops on first failure
        required: false
        default: 1
        type: number
      repeat_methods:
        description: Optional comma-separated Class#method witnesses; mandatory regressions run once before these repetitions
        required: false
        default: ''
        type: string
      affected_classes:
        required: true
        type: string
      coverage_reason:
        required: true
        type: string
      known_issues:
        required: false
        default: ''
        type: string
      runner:
        required: false
        default: hosted
        type: string
    secrets:
      LASTFM_API_KEY:
        required: false
      ANDROID_DEBUG_KEYSTORE:
        required: true
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity:
    name: Commit identities and attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Exercise identity guard policy
        run: node .github/tests/test_commit_identity.mjs
      - name: Verify commit identities and attribution
        run: node .github/check-commit-identity.mjs
  # Two independent chains cap this workflow at two occupied runners:
  # build -> compatibility_26 -> compatibility_36; focused_26 -> focused_36.
  # Explicit status conditions preserve all checks after an earlier failure.
  build:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Restores the shared main-branch dependency cache written by dependency-cache.yml and Android static-checks (#681).
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: localica-static-checks
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: shared
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - name: Record restored dependency files
      run: bash .github/dependency-cache-audit.sh snapshot
    - name: Restore development signing key
      env:
        DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        KEYSTORE_PATH: ${{ runner.temp }}/localica-debug.keystore
      run: |
        test -n "$DEBUG_KEYSTORE"
        printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"
        echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Build and check
      # The Kotlin daemon inherits this heap; debug and release compile concurrently in it (#636).
      # Same sizing as the Android workflow static-checks job on the same 16 GB hosted runner.
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      run: bash .github/gradle-transient-retry.sh ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --max-workers=4 -Dorg.gradle.jvmargs='-Xmx6g -Dfile.encoding=UTF-8'
    - name: Record downloaded dependency files
      if: ${{ !cancelled() }}
      run: bash .github/dependency-cache-audit.sh report
    - name: Verify development signing certificate
      run: |
        expected=$(keytool -exportcert -alias androiddebugkey -keystore "$LOCALICA_DEBUG_KEYSTORE" -storepass android | sha256sum | cut -d ' ' -f 1)
        actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
        test "$expected" = "$actual"
    - name: Record verified APK checksum
      working-directory: app/build/outputs/apk/debug
      run: sha256sum app-debug.apk > app-debug.apk.sha256
    - name: Record exact candidate provenance
      env:
        COVERAGE_REASON: ${{ inputs.coverage_reason }}
        AFFECTED_CLASSES: ${{ inputs.affected_classes }}
      run: |-
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python3 - <<'PYCODE'
        import hashlib,json,os,pathlib,subprocess
        apk=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
        certificate=subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/35.0.0/apksigner','verify','--print-certs',str(apk)],text=True)
        json.dump({'schema_version':1,'lane':'prototype','release_certified':False,'sha':os.environ['GITHUB_SHA'],'ref':os.environ['GITHUB_REF'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'signing_certificate':certificate,'requested_affected_classes':os.environ['AFFECTED_CLASSES'].split(','),'coverage_reason':os.environ['COVERAGE_REASON'],'native_test_apks':'independent same-SHA builds; see each focused job hash receipt'},open(apk.parent/'provenance.json','w'),indent=2)
        PYCODE
    - uses: ./.github/actions/upload-artifact-retry
      with:
        name: prototype-build-internal-unvalidated
        path: |-
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/app-debug.apk.sha256

          app/build/outputs/apk/debug/provenance.json
        if-no-files-found: error
    - uses: ./.github/actions/upload-artifact-retry
      if: always()
      with:
        name: prototype-build-reports
        path: |-
          app/build/reports/
          prototype-runner-environment.txt
          ci-infrastructure/
    name: Prototype build, unit tests and lint
  focused_26:
    needs: identity
    # runner=self-hosted (#592): the owner's locked-down single-job JIT runner, labelled with this
    # run id. Only an owner workflow_dispatch of this workflow may use it; anything else is skipped,
    # never rerouted to a hosted runner. The runner's job-started hook repeats every check.
    if: ${{ needs.identity.result == 'success' && (inputs.runner != 'self-hosted' || (github.event_name == 'workflow_dispatch' && github.repository == 'anastaci1a/localica' && github.actor == 'anastaci1a' && github.triggering_actor == 'anastaci1a' && startsWith(github.workflow_ref, 'anastaci1a/localica/.github/workflows/prototype.yml@refs/heads/'))) }}
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON(format('["self-hosted","Linux","X64","localica-jit","ljit-{0}"]', github.run_id)) || 'ubuntu-24.04' }}
    # Repeated proofs retain all selected methods and stop on their first failure;
    # otherwise capacity for the complete selected gate, not a throughput optimization.
    timeout-minutes: ${{ inputs.repeat_methods != '' && 60 || inputs.repeat > 1 && 360 || 35 }}
    env:
      AFFECTED_CLASSES: ${{ inputs.affected_classes }}
      PROTOTYPE_METHODS: ${{ inputs.repeat_methods }}
      PROTOTYPE_REPEAT: ${{ inputs.repeat }}
      TEST_API: '26'
      # Restores the shared main-branch dependency cache written by dependency-cache.yml and Android test-apks (#681).
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: localica-test-apks
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: shared
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      # The JIT image carries JDK 17; Temurin would come from a GitHub release (#681).
      if: inputs.runner != 'self-hosted'
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      # The self-hosted image carries a read-only dependency cache (GRADLE_RO_DEP_CACHE).
      if: inputs.runner != 'self-hosted'
    - name: Record restored dependency files
      if: inputs.runner != 'self-hosted'
      run: bash .github/dependency-cache-audit.sh snapshot
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      # The JIT image carries Node 24 and npm; the hosted toolcache would come from a GitHub release (#681).
      if: inputs.runner != 'self-hosted'
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      if: inputs.runner != 'self-hosted'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Make room for emulator userdata
      if: inputs.runner != 'self-hosted'
      run: |
        # This Android job does not use the runner's preinstalled .NET SDKs.
        sudo rm -rf /usr/share/dotnet
        df -h "$HOME"
    - name: Compile instrumentation APKs before starting emulator
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      run: bash .github/gradle-transient-retry.sh ./gradlew assembleDebug assembleDebugAndroidTest :app:warmDeviceDependencies -I .github/warm-device-dependencies.gradle --no-daemon --max-workers=2
    - name: Record downloaded dependency files
      if: ${{ !cancelled() && inputs.runner != 'self-hosted' }}
      run: bash .github/dependency-cache-audit.sh report
    - name: Run on a disposable emulator (self-hosted JIT runner)
      if: ${{ inputs.runner == 'self-hosted' }}
      env:
        EMULATOR_API: '26'
        EMULATOR_TARGET: google_apis
        EMULATOR_PROFILE: pixel_2
        EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -show-kernel -feature -GLDMA
        EMULATOR_DISABLE_ANIMATIONS: 'true'
        EMULATOR_SCRIPT: |
          adb shell wm size reset
          adb shell wm density reset
          python3 .github/emulator-readiness.py --normalize-navigation
          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
          bash .github/run-prototype-tests.sh
      run: bash .github/local/with-emulator.sh
    - name: Prepare the verified emulator SDK
      if: inputs.runner != 'self-hosted'
      uses: ./.github/actions/emulator-sdk-cache
    - name: Restore the exact SDK system image revision
      id: emulator-image-cache
      if: inputs.runner != 'self-hosted'
      uses: ./.github/actions/system-image-cache
      with:
        api: 26
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      if: inputs.runner != 'self-hosted'
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -show-kernel -feature -GLDMA
        disable-animations: true
        script: |
          adb shell wm size reset
          adb shell wm density reset
          python3 .github/emulator-readiness.py --normalize-navigation
          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
          bash .github/run-prototype-tests.sh
    - name: Cache the installed SDK system image
      if: always() && steps.emulator-image-cache.outputs.cache-hit != 'true' && inputs.runner != 'self-hosted'
      uses: ./.github/actions/system-image-cache
      with:
        api: 26
        mode: save
    - name: Preserve emulator readiness observations
      if: always()
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: emulator-readiness-${{ github.job }}-${{ strategy.job-index }}
        path: emulator-readiness.json
        if-no-files-found: warn
    - name: Preserve emulator crash database
      if: failure()
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: prototype-emulator-crashes-api-26
        path: /tmp/android-runner/emu-crash-*/
        if-no-files-found: warn
    - name: Capture host diagnostics on emulator failure
      if: failure() && inputs.runner != 'self-hosted'
      run: |
        free -h
        df -h
        sudo dmesg --ctime | tail -100
    - uses: ./.github/actions/upload-artifact-retry
      if: always()
      with:
        name: prototype-focused-api-26
        path: |-
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
          app/build/outputs/connected_android_test_additional_output/

          prototype-evidence/
          prototype-iterations/
          prototype-runner-environment.txt
          ci-infrastructure/
        if-no-files-found: error
    name: Prototype focused API 26
  compatibility_26:
    needs: [identity, build]
    if: ${{ needs.identity.result == 'success' && (!cancelled()) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Restores the shared main-branch dependency cache written by dependency-cache.yml and Android test-apks (#681).
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: localica-test-apks
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: shared
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - name: Record restored dependency files
      run: bash .github/dependency-cache-audit.sh snapshot
    - name: Restore existing development signing key
      env:
        DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        KEYSTORE_PATH: ${{ runner.temp }}/compatibility-debug.keystore
      run: |
        test -n "$DEBUG_KEYSTORE"
        printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"
        echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
    - name: Prepare isolated exact-SHA compatibility archives
      run: python3 .github/compatibility/prepare.py
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration and make room
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo rm -rf /usr/share/dotnet
    - name: Build and inspect private compatibility APKs sequentially
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      run: bash .github/compatibility/build.sh
    - name: Record downloaded dependency files
      if: ${{ !cancelled() }}
      run: bash .github/dependency-cache-audit.sh report
    - name: Prepare the verified emulator SDK
      uses: ./.github/actions/emulator-sdk-cache
    - name: Restore the exact SDK system image revision
      id: emulator-image-cache
      uses: ./.github/actions/system-image-cache
      with:
        api: 26
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -feature -GLDMA
        disable-animations: true
        script: |
          adb shell wm size reset
          adb shell wm density reset
          python3 .github/emulator-readiness.py --normalize-navigation
          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
          bash .github/compatibility/run.sh
    - name: Cache the installed SDK system image
      if: always() && steps.emulator-image-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/system-image-cache
      with:
        api: 26
        mode: save
    - name: Preserve emulator readiness observations
      if: always()
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: emulator-readiness-${{ github.job }}-${{ strategy.job-index }}
        path: emulator-readiness.json
        if-no-files-found: warn
    - name: Preserve compatibility runner identity
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/shuffle-compatibility/reports"
        cp prototype-runner-environment.txt "$RUNNER_TEMP/shuffle-compatibility/reports/prototype-runner-environment.txt"
    - uses: ./.github/actions/upload-artifact-retry
      if: always()
      with:
        name: prototype-compatibility-api-26
        path: ${{ runner.temp }}/shuffle-compatibility/reports/
        if-no-files-found: error
    name: Prototype preserved-data compatibility API 26
  focused_36:
    needs: [identity, focused_26]
    # runner=self-hosted (#592): see focused_26; the same guard, never rerouted.
    if: ${{ needs.identity.result == 'success' && (!cancelled() && (inputs.runner != 'self-hosted' || (github.event_name == 'workflow_dispatch' && github.repository == 'anastaci1a/localica' && github.actor == 'anastaci1a' && github.triggering_actor == 'anastaci1a' && startsWith(github.workflow_ref, 'anastaci1a/localica/.github/workflows/prototype.yml@refs/heads/')))) }}
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON(format('["self-hosted","Linux","X64","localica-jit","ljit-{0}"]', github.run_id)) || 'ubuntu-24.04' }}
    # Repeated proofs retain all selected methods and stop on their first failure;
    # otherwise capacity for the complete selected gate, not a throughput optimization.
    timeout-minutes: ${{ inputs.repeat_methods != '' && 60 || inputs.repeat > 1 && 360 || 35 }}
    env:
      AFFECTED_CLASSES: ${{ inputs.affected_classes }}
      PROTOTYPE_METHODS: ${{ inputs.repeat_methods }}
      PROTOTYPE_REPEAT: ${{ inputs.repeat }}
      TEST_API: '36'
      LOCALICA_SHARD_COUNT: '8'
      LOCALICA_SHARD_INDEX: '7'
      LOCALICA_LIVE_EVIDENCE: 'true'
      # Restores the shared main-branch dependency cache written by dependency-cache.yml and Android test-apks (#681).
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: localica-test-apks
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: shared
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      # The JIT image carries JDK 17; Temurin would come from a GitHub release (#681).
      if: inputs.runner != 'self-hosted'
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      # The self-hosted image carries a read-only dependency cache (GRADLE_RO_DEP_CACHE).
      if: inputs.runner != 'self-hosted'
    - name: Record restored dependency files
      if: inputs.runner != 'self-hosted'
      run: bash .github/dependency-cache-audit.sh snapshot
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      # The JIT image carries Node 24 and npm; the hosted toolcache would come from a GitHub release (#681).
      if: inputs.runner != 'self-hosted'
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      if: inputs.runner != 'self-hosted'
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Make room for emulator userdata
      if: inputs.runner != 'self-hosted'
      run: |
        # This Android job does not use the runner's preinstalled .NET SDKs.
        sudo rm -rf /usr/share/dotnet
        df -h "$HOME"
    - name: Compile instrumentation APKs before starting emulator
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      run: bash .github/gradle-transient-retry.sh ./gradlew assembleDebug assembleDebugAndroidTest :app:warmDeviceDependencies -I .github/warm-device-dependencies.gradle --no-daemon --max-workers=2
    - name: Record downloaded dependency files
      if: ${{ !cancelled() && inputs.runner != 'self-hosted' }}
      run: bash .github/dependency-cache-audit.sh report
    - name: Run on a disposable emulator (self-hosted JIT runner)
      if: ${{ inputs.runner == 'self-hosted' }}
      env:
        EMULATOR_API: '36'
        EMULATOR_TARGET: default
        EMULATOR_PROFILE: pixel_2
        EMULATOR_OPTIONS: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072 -show-kernel
        EMULATOR_DISABLE_ANIMATIONS: 'false'
        EMULATOR_SCRIPT: |
          adb shell wm size 720x1280
          adb shell wm density 280
          python3 .github/emulator-readiness.py --normalize-navigation
          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
          bash .github/run-device-tests.sh
      run: bash .github/local/with-emulator.sh
    - name: Prepare the verified emulator SDK
      if: inputs.runner != 'self-hosted'
      uses: ./.github/actions/emulator-sdk-cache
    - name: Restore the exact SDK system image revision
      id: emulator-image-cache
      if: inputs.runner != 'self-hosted'
      uses: ./.github/actions/system-image-cache
      with:
        api: 36
    - id: emulator-first
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      if: inputs.runner != 'self-hosted'
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072 -show-kernel
        disable-animations: false
        script: |
          adb shell wm size 720x1280
          adb shell wm density 280
          python3 .github/emulator-readiness.py --normalize-navigation
          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
          python3 .github/prototype-health.py
    - name: Preserve lost-emulator attempt and authorize one fresh boot
      id: emulator-recovery
      if: ${{ !cancelled() && steps.emulator-first.outcome == 'failure' }}
      run: |
        if [[ -f ci-infrastructure/emulator.json ]]; then
          python3 .github/prototype-health.py --prepare-restart
          echo 'restart=true' >> "$GITHUB_OUTPUT"
        fi
    - id: emulator-restart
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      if: ${{ !cancelled() && steps.emulator-recovery.outputs.restart == 'true' }}
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072 -show-kernel
        disable-animations: false
        script: |
          adb shell wm size 720x1280
          adb shell wm density 280
          python3 .github/emulator-readiness.py --normalize-navigation
          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
          python3 .github/prototype-health.py
    - name: Require a complete focused emulator run
      if: ${{ !cancelled() && inputs.runner != 'self-hosted' && steps.emulator-first.outcome != 'success' }}
      run: test '${{ steps.emulator-restart.outcome }}' = success
    - name: Cache the installed SDK system image
      if: always() && steps.emulator-image-cache.outputs.cache-hit != 'true' && inputs.runner != 'self-hosted'
      uses: ./.github/actions/system-image-cache
      with:
        api: 36
        mode: save
    - name: Preserve emulator readiness observations
      if: always()
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: emulator-readiness-${{ github.job }}-${{ strategy.job-index }}
        path: emulator-readiness.json
        if-no-files-found: warn
    - name: Preserve emulator crash database
      if: failure()
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: prototype-emulator-crashes-api-36
        path: /tmp/android-runner/emu-crash-*/
        if-no-files-found: warn
    - name: Capture host diagnostics on emulator failure
      if: failure() && inputs.runner != 'self-hosted'
      run: |
        free -h
        df -h
        sudo dmesg --ctime | tail -100
    - uses: ./.github/actions/upload-artifact-retry
      if: always()
      with:
        name: prototype-focused-api-36
        path: |-
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
          app/build/outputs/connected_android_test_additional_output/

          prototype-evidence/
          native-shard-plan.json
          native-live-evidence/
          prototype-iterations/
          prototype-runner-environment.txt
          ci-infrastructure/
          prototype-infrastructure/
        if-no-files-found: error
    name: Prototype focused API 36
  compatibility_36:
    needs: [identity, compatibility_26]
    if: ${{ needs.identity.result == 'success' && (!cancelled()) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Restores the shared main-branch dependency cache written by dependency-cache.yml and Android test-apks (#681).
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: localica-test-apks
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: shared
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - name: Record restored dependency files
      run: bash .github/dependency-cache-audit.sh snapshot
    - name: Restore existing development signing key
      env:
        DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        KEYSTORE_PATH: ${{ runner.temp }}/compatibility-debug.keystore
      run: |
        test -n "$DEBUG_KEYSTORE"
        printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"
        echo "LOCALICA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
    - name: Prepare isolated exact-SHA compatibility archives
      run: python3 .github/compatibility/prepare.py
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration and make room
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo rm -rf /usr/share/dotnet
    - name: Build and inspect private compatibility APKs sequentially
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      run: bash .github/compatibility/build.sh
    - name: Record downloaded dependency files
      if: ${{ !cancelled() }}
      run: bash .github/dependency-cache-audit.sh report
    - name: Prepare the verified emulator SDK
      uses: ./.github/actions/emulator-sdk-cache
    - name: Restore the exact SDK system image revision
      id: emulator-image-cache
      uses: ./.github/actions/system-image-cache
      with:
        api: 36
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072
        disable-animations: false
        script: |
          adb shell wm size 720x1280
          adb shell wm density 280
          python3 .github/emulator-readiness.py --normalize-navigation
          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
          bash .github/compatibility/run.sh
    - name: Cache the installed SDK system image
      if: always() && steps.emulator-image-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/system-image-cache
      with:
        api: 36
        mode: save
    - name: Preserve emulator readiness observations
      if: always()
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: emulator-readiness-${{ github.job }}-${{ strategy.job-index }}
        path: emulator-readiness.json
        if-no-files-found: warn
    - name: Preserve compatibility runner identity
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/shuffle-compatibility/reports"
        cp prototype-runner-environment.txt "$RUNNER_TEMP/shuffle-compatibility/reports/prototype-runner-environment.txt"
    - uses: ./.github/actions/upload-artifact-retry
      if: always()
      with:
        name: prototype-compatibility-api-36
        path: ${{ runner.temp }}/shuffle-compatibility/reports/
        if-no-files-found: error
    name: Prototype preserved-data compatibility API 36
  evidence:
    name: Prototype evidence and delivery decision
    if: ${{ always() }}
    needs:
    - identity
    - build
    - focused_26
    - compatibility_26
    - focused_36
    - compatibility_36
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Download available prototype evidence
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: prototype-*
        path: evidence
    - name: Record passed, failed and not-run checks
      env:
        PROTOTYPE_METHODS: ${{ inputs.repeat_methods }}
        PROTOTYPE_REPEAT: ${{ inputs.repeat }}
        CHECKS: ${{ toJSON(needs) }}
        KNOWN_ISSUES: ${{ inputs.known_issues }}
        AFFECTED_CLASSES: ${{ inputs.affected_classes }}
        COVERAGE_REASON: ${{ inputs.coverage_reason }}
      run: |
        python3 - <<'PYCODE'
        import hashlib
        import json
        import os
        import pathlib
        import shutil

        checks = json.loads(os.environ['CHECKS'])
        status = {'success': 'passed', 'failure': 'failed', 'skipped': 'not-run', 'cancelled': 'cancelled'}
        results = {key: status.get(value['result'], 'incomplete') for key, value in checks.items()}
        root = pathlib.Path('evidence')
        manifest = {
            'schema_version': 1, 'lane': 'prototype', 'release_certified': False,
            'sha': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'],
            'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'checks': results,
            'requested_affected_classes': os.environ['AFFECTED_CLASSES'].split(','),
            'required_regression_classes': ['io.github.anastaci1a.localica.SearchImeMotionTest', 'io.github.anastaci1a.localica.ListSearchTest', 'io.github.anastaci1a.localica.FrostedSurfaceTest'],
            'coverage_reason': os.environ['COVERAGE_REASON'], 'known_issues': os.environ['KNOWN_ISSUES'],
            'full_native_api_26': 'not-run', 'full_native_api_36': 'not-run',
            'monitoring': 'Supervised observer and bounded live artifact publisher; inspect monitoring status separately from final XML',
            'native_test_apks': 'Independent same-SHA builds, not asserted identical to canonical signed delivery APK',
            'ready_for_prototype_delivery': False, 'validation_errors': [],
            'focused_evidence': {}, 'compatibility_evidence': {},
            'requested_iterations': int(os.environ.get('PROTOTYPE_REPEAT', '1')),
            'requested_methods': list(filter(None, os.environ.get('PROTOTYPE_METHODS', '').split(','))),
        }
        errors = manifest['validation_errors']
        canonical = root / 'prototype-build-internal-unvalidated'
        apk = canonical / 'app-debug.apk'
        canonical_valid = False
        if apk.exists():
            try:
                provenance = json.loads((canonical / 'provenance.json').read_text())
                digest = hashlib.sha256(apk.read_bytes()).hexdigest()
                assert provenance['sha'] == manifest['sha'] and provenance['apk_sha256'] == digest, 'Canonical APK SHA or digest does not match provenance'
                assert provenance['run_id'] == manifest['run_id'], 'Canonical APK provenance belongs to a different run'
                # A single-job retry retains the canonical APK from an earlier build attempt.
                assert 1 <= int(provenance['run_attempt']) <= int(manifest['run_attempt']), 'Canonical APK build attempt is outside this run attempt'
                manifest['build_run_attempt'] = provenance['run_attempt']
                manifest['apk_sha256'] = digest
                manifest['signing_certificate'] = provenance['signing_certificate']
                canonical_valid = True
            except (AssertionError, KeyError, ValueError, OSError) as error:
                errors.append('Canonical APK provenance validation failed: ' + type(error).__name__ + ': ' + str(error))
        expected = set(manifest['requested_affected_classes']) | set(manifest['required_regression_classes'])
        for api in (26, 36):
            focused = root / f'prototype-focused-api-{api}' / 'prototype-evidence'
            receipt = focused / 'reconciled-tests.json'
            if receipt.exists():
                try:
                    data = json.loads(receipt.read_text())
                    requested_methods = manifest['requested_methods']
                    required = set(manifest['required_regression_classes'])
                    api_expected = expected
                    if requested_methods:
                        summary = json.loads((focused / 'iterations/summary.json').read_text())
                        gate_class = summary['gate']['class']
                        assert gate_class in manifest['requested_affected_classes'] and gate_class not in required, f'API {api}: Mandatory method gate is not an affected non-regression class'
                        assert summary['gate']['status'] == 'passed' and summary['gate']['exit_code'] == 0, f'API {api}: Mandatory method gate did not pass'
                        assert hashlib.sha256(receipt.read_bytes()).hexdigest() == summary['gate']['receipt_sha256'], f'API {api}: Mandatory method gate receipt digest does not match its summary'
                        api_expected = required | {gate_class}
                    assert data['sha'] == manifest['sha'] and str(data['api']) == str(api), f'API {api}: Focused receipt SHA or API does not match the requested candidate'
                    assert set(data['selectors']) == api_expected and set(data['counts']) == api_expected, f'API {api}: Focused selectors or count classes differ from the requested selection'
                    source_bytes = (focused / 'expected-methods.json').read_bytes()
                    source_inventory = json.loads(source_bytes)
                    assert hashlib.sha256(source_bytes).hexdigest() == data['source_inventory_sha256'], f'API {api}: Focused source inventory digest does not match its receipt'
                    assert set(source_inventory['selectors']) == api_expected, f'API {api}: Source inventory selectors differ from the requested selection'
                    assert set(data['methods']) == set(source_inventory['runtime_methods']), f'API {api}: Focused method identities differ from the source inventory'
                    required = set(manifest['required_regression_classes'])
                    assert set(data['required_selectors']) == required, f'API {api}: Focused mandatory regressions differ from the requested regressions'
                    derived = {c: {'passed': 0, 'failed': 0, 'errors': 0, 'skipped': 0} for c in api_expected}
                    for method, outcome in data['methods'].items():
                        cls, name = method.rsplit('#', 1)
                        assert cls in api_expected and name and outcome in derived[cls], f'API {api}: Focused receipt has an unexpected class, empty method or invalid outcome'
                        derived[cls][outcome] += 1
                        assert cls not in required or outcome == 'passed', f'API {api}: A mandatory regression did not pass'
                    assert derived == data['counts'], f'API {api}: Focused counts differ from the method outcomes'
                    # #464: a class whose every method is SdkSuppress-gated above this API legitimately runs nothing.
                    gated_classes = set(source_inventory.get('gated_absent_classes', []))
                    assert not gated_classes & required, f'API {api}: A mandatory regression class is SDK-excluded'
                    # ...or one that only skips methods whose own assumeTrue(SDK_INT >= N) is above this API.
                    gates = source_inventory.get('gates', {})
                    def only_source_gated_skips(cls):
                        skipped = [m for m, o in data['methods'].items() if m.rsplit('#', 1)[0] == cls and o == 'skipped']
                        return bool(skipped) and len(skipped) == data['counts'][cls]['skipped'] and all(
                            gates.get(m, {}).get('assume_min_sdk', 0) > api for m in skipped)
                    assert all(value['failed'] == 0 and value['errors'] == 0 and
                               (value['passed'] > 0 or (cls in gated_classes and not any(value.values()))
                                or only_source_gated_skips(cls))
                               for cls, value in data['counts'].items()), f'API {api}: A selected class failed or lacks passing or qualified SDK coverage'
                    data['independent_test_apk_hashes'] = (focused / 'test-input-apks.sha256').read_text()
                    repetitions = manifest['requested_iterations']
                    assert 1 <= repetitions <= 30, f'API {api}: Requested repetition count is outside 1..30'
                    if repetitions > 1 and not requested_methods:
                        iteration_root = focused / 'iterations'
                        summary = json.loads((iteration_root / 'summary.json').read_text())
                        assert summary['sha'] == manifest['sha'] and str(summary['api']) == str(api), f'API {api}: Repetition summary SHA or API differs from the candidate'
                        assert summary['requested'] == repetitions, f'API {api}: Repetition summary count differs from the request'
                        assert [item['iteration'] for item in summary['iterations']] == list(range(1, repetitions + 1)), f'API {api}: Repetition summary has missing, duplicate or unordered iterations'
                        for item in summary['iterations']:
                            assert item['status'] == 'passed' and item['exit_code'] == 0, f'API {api} iteration {item["iteration"]}: Iteration did not pass'
                            folder = iteration_root / f"iteration-{item['iteration']:02d}" / 'prototype-evidence'
                            raw = (folder / 'reconciled-tests.json').read_bytes()
                            assert hashlib.sha256(raw).hexdigest() == item['receipt_sha256'], f'API {api} iteration {item["iteration"]}: Iteration receipt digest differs from its summary'
                            repeated = json.loads(raw)
                            assert repeated['sha'] == manifest['sha'] and str(repeated['api']) == str(api), f'API {api} iteration {item["iteration"]}: Iteration receipt SHA or API differs from the candidate'
                            assert repeated['selectors'] == data['selectors'], f'API {api} iteration {item["iteration"]}: Iteration selectors differ from the focused receipt'
                            assert repeated['methods'] == data['methods'] and repeated['counts'] == data['counts'], f'API {api} iteration {item["iteration"]}: Iteration method outcomes or counts differ from the focused receipt'
                            assert repeated['source_inventory_sha256'] == data['source_inventory_sha256'], f'API {api} iteration {item["iteration"]}: Iteration source inventory digest differs from the focused receipt'
                            assert (folder / 'test-input-apks.sha256').read_bytes() == (focused / 'test-input-apks.sha256').read_bytes(), f'API {api} iteration {item["iteration"]}: Iteration test APK digests differ from the focused receipt'
                        data['repetition_summary'] = summary
                    if requested_methods:
                        iteration_root = focused / 'iterations'
                        assert summary['kind'] == 'methods', f'API {api}: Method repetition summary has the wrong kind'
                        assert summary['sha'] == manifest['sha'] and str(summary['api']) == str(api), f'API {api}: Method repetition summary SHA or API differs from the candidate'
                        assert summary['requested'] == repetitions, f'API {api}: Method repetition summary count differs from the request'
                        assert summary['methods'] == sorted(requested_methods), f'API {api}: Method repetition summary selectors differ from the requested methods'
                        assert len(requested_methods) == len(set(requested_methods)), f'API {api}: Requested method selectors contain duplicates'
                        requested_classes = {method.rsplit('#', 1)[0] for method in requested_methods}
                        assert requested_classes == set(manifest['requested_affected_classes']), f'API {api}: Requested method classes differ from the affected classes'
                        inventory_bytes = (iteration_root / 'requested-methods.json').read_bytes()
                        method_inventory = json.loads(inventory_bytes)
                        assert set(method_inventory['runtime_methods']) == set(requested_methods), f'API {api}: Method inventory identities differ from the requested methods'
                        assert set(method_inventory['selectors']) == requested_classes, f'API {api}: Method inventory classes differ from the requested classes'
                        assert [item['iteration'] for item in summary['iterations']] == list(range(1, repetitions + 1)), f'API {api}: Method summary has missing, duplicate or unordered iterations'
                        command_ids = set()
                        for item in summary['iterations']:
                            assert item['status'] == 'passed' and item['exit_code'] == 0, f'API {api} iteration {item["iteration"]}: Iteration did not pass'
                            folder = iteration_root / f"iteration-{item['iteration']:02d}" / 'prototype-evidence'
                            raw = (folder / 'reconciled-tests.json').read_bytes()
                            assert hashlib.sha256(raw).hexdigest() == item['receipt_sha256'], f'API {api} iteration {item["iteration"]}: Iteration receipt digest differs from its summary'
                            repeated = json.loads(raw)
                            assert repeated['sha'] == manifest['sha'] and str(repeated['api']) == str(api), f'API {api} iteration {item["iteration"]}: Iteration receipt SHA or API differs from the candidate'
                            assert set(repeated['selectors']) == requested_classes, f'API {api} iteration {item["iteration"]}: Iteration method classes differ from the requested classes'
                            assert repeated['methods'] == {method: 'passed' for method in requested_methods}, f'API {api} iteration {item["iteration"]}: Iteration method outcomes differ from the requested passing methods'
                            method_counts = {c: {'passed': 0, 'failed': 0, 'errors': 0, 'skipped': 0} for c in requested_classes}
                            for method in requested_methods:
                                method_counts[method.rsplit('#', 1)[0]]['passed'] += 1
                            assert repeated['counts'] == method_counts, f'API {api} iteration {item["iteration"]}: Iteration counts differ from the requested method counts'
                            source_bytes = (folder / 'expected-methods.json').read_bytes()
                            assert hashlib.sha256(source_bytes).hexdigest() == repeated['source_inventory_sha256'], f'API {api} iteration {item["iteration"]}: Iteration source inventory digest differs from its receipt'
                            assert json.loads(source_bytes) == method_inventory, f'API {api} iteration {item["iteration"]}: Iteration source inventory differs from the requested method inventory'
                            assert (folder / 'test-input-apks.sha256').read_bytes() == (focused / 'test-input-apks.sha256').read_bytes(), f'API {api} iteration {item["iteration"]}: Iteration test APK digests differ from the focused receipt'
                            observed = json.loads((folder / 'live/observed/manifest.json').read_text())
                            assert observed['status'] == 'completed' and observed['child_returncode'] == 0, f'API {api} iteration {item["iteration"]}: Iteration observer did not complete with a successful child exit'
                            assert observed['observer_exit_status'] == 0 and observed['observed_failure_lines'] == 0, f'API {api} iteration {item["iteration"]}: Iteration observer failed or recorded failing tests'
                            assert observed['sha'] == manifest['sha'] and str(observed['api']) == str(api), f'API {api} iteration {item["iteration"]}: Iteration observer SHA or API differs from the candidate'
                            assert observed['command_id'] not in command_ids, f'API {api} iteration {item["iteration"]}: Iteration observer command identity was reused'
                            command_ids.add(observed['command_id'])
                        data['method_repetition_summary'] = summary
                    manifest['focused_evidence'][str(api)] = data
                except (AssertionError, KeyError, ValueError, TypeError, OSError) as error:
                    errors.append(f'Focused API {api} evidence is not passing: ' + type(error).__name__ + ': ' + str(error))
            compatibility = root / f'prototype-compatibility-api-{api}' / 'provenance.json'
            if compatibility.exists():
                try:
                    data = json.loads(compatibility.read_text())
                    assert data['source_sha'] == manifest['sha'], f'API {api}: Compatibility provenance SHA differs from the candidate'
                    manifest['compatibility_evidence'][str(api)] = {
                        'source_sha': data['source_sha'], 'private_variants_not_distributed': True}
                except (AssertionError, KeyError, ValueError, OSError) as error:
                    errors.append(f'Compatibility API {api} provenance validation failed: ' + type(error).__name__ + ': ' + str(error))
        manifest['infrastructure_failures'] = []
        jobs_by_artifact = {'prototype-build-reports': 'build',
                            'prototype-focused-api-26': 'focused_26', 'prototype-focused-api-36': 'focused_36',
                            'prototype-compatibility-api-26': 'compatibility_26',
                            'prototype-compatibility-api-36': 'compatibility_36'}
        infrastructure_jobs = set()
        for receipt in sorted(root.rglob('ci-infrastructure/*.json')):
            record = json.loads(receipt.read_text())
            if record.get('classification') != 'infrastructure':
                continue
            relative = receipt.relative_to(root)
            job = jobs_by_artifact.get(relative.parts[0])
            historical = 'prototype-infrastructure' in relative.parts
            manifest['infrastructure_failures'].append({'evidence': str(receipt), 'job': job,
                                                       'historical': historical, **record})
            context_valid = (record.get('sha') == manifest['sha'] and record.get('run_id') == manifest['run_id']
                             and record.get('run_attempt') == manifest['run_attempt'] and record.get('job') == job)
            if job and not historical and context_valid:
                infrastructure_jobs.add(job)
        manifest['check_classification'] = {
            job: ('infrastructure' if job in infrastructure_jobs else 'unclassified')
            for job, status in results.items() if status == 'failed'}
        failures = set(manifest['check_classification'].values())
        manifest['failure_classification'] = ('mixed' if len(failures) > 1 else next(iter(failures), None))
        all_checks_passed = all(value == 'passed' for value in results.values())
        complete = canonical_valid and len(manifest['focused_evidence']) == 2 and len(manifest['compatibility_evidence']) == 2
        if all_checks_passed and not complete:
            errors.append('Passed job statuses lack complete exact-SHA evidence; delivery blocked')
        ready = all_checks_passed and complete and not errors
        manifest['ready_for_prototype_delivery'] = ready
        out = pathlib.Path('prototype-delivery')
        out.mkdir()
        if ready:
            shutil.copy2(apk, out / 'localica-prototype-NOT-RELEASE-CERTIFIED.apk')
            (out / 'localica-prototype-NOT-RELEASE-CERTIFIED.apk.sha256').write_text(
                manifest['apk_sha256'] + '  localica-prototype-NOT-RELEASE-CERTIFIED.apk\n')
        (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('## Prototype — not release certified\n' + (
                'Required checks passed; prototype APK attached.' if ready else
                'Not ready: no delivery APK packaged. See per-job evidence.') + '\n')
        if errors:
            raise SystemExit('Prototype evidence validation failed; see the held decision manifest')
        PYCODE
    - name: Upload explicit delivery decision and eligible APK
      uses: ./.github/actions/upload-artifact-retry
      with:
        name: prototype-delivery-decision
        path: prototype-delivery/
        if-no-files-found: error
      if: ${{ always() }}
