# Manual development builds only. Existing Android release gates remain unchanged.
name: Prototype (not release certified)
'on':
  workflow_dispatch:
    inputs:
      repeat:
        description: Independent iterations of the complete selected gate (1-30); stops on first failure
        required: false
        default: 1
        type: number
      repeat_methods:
        description: Optional comma-separated Class#method witnesses; mandatory regressions run once before these repetitions
        required: false
        default: ''
        type: string
      affected_classes:
        description: Comma-separated affected behavior test classes; IME, focus and contrast regressions are added automatically
        required: true
        type: string
      coverage_reason:
        description: What changed and why these classes cover it
        required: true
        type: string
      known_issues:
        description: Disclosed limitations; never waives a failing required check
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      repeat:
        description: Independent iterations of the complete selected gate (1-30); stops on first failure
        required: false
        default: 1
        type: number
      repeat_methods:
        description: Optional comma-separated Class#method witnesses; mandatory regressions run once before these repetitions
        required: false
        default: ''
        type: string
      affected_classes:
        required: true
        type: string
      coverage_reason:
        required: true
        type: string
      known_issues:
        required: false
        default: ''
        type: string
    secrets:
      ANDROID_DEBUG_KEYSTORE:
        required: true
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
# Private API36 setup proof only; never merge this workflow edit.
jobs:
  focused_36:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Repeated proofs retain all selected methods and stop on their first failure;
    # otherwise capacity for the complete selected gate, not a throughput optimization.
    timeout-minutes: ${{ inputs.repeat_methods != '' && 60 || inputs.repeat > 1 && 360 || 35 }}
    env:
      AFFECTED_CLASSES: ${{ inputs.affected_classes }}
      PROTOTYPE_METHODS: ${{ inputs.repeat_methods }}
      PROTOTYPE_REPEAT: ${{ inputs.repeat }}
      TEST_API: '36'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pinned live evidence publisher
      run: npm ci --prefix .github/test-evidence --ignore-scripts --no-audit --no-fund
    - name: Record runner and toolchain identity
      run: bash .github/test-evidence/environment.sh | tee prototype-runner-environment.txt
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Make room for emulator userdata
      run: |
        # This Android job does not use the runner's preinstalled .NET SDKs.
        sudo rm -rf /usr/share/dotnet
        df -h "$HOME"
    - name: Compile instrumentation APKs before starting emulator
      run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
    - name: Restore the exact SDK system image revision
      id: emulator-image-cache
      uses: ./.github/actions/system-image-cache
      with:
        api: 36
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -memory 3072 -show-kernel
        disable-animations: false
        script: |
          adb shell wm size 720x1280
          adb shell wm density 280
          python3 .github/emulator-readiness.py --normalize-navigation
          bash .github/test-evidence/environment.sh >> prototype-runner-environment.txt
          bash .github/run-prototype-tests.sh
    - name: Cache the installed SDK system image
      if: always() && steps.emulator-image-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/system-image-cache
      with:
        api: 36
        mode: save
    - name: Preserve emulator readiness observations
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: emulator-readiness-${{ github.job }}-${{ strategy.job-index }}
        path: emulator-readiness.json
        if-no-files-found: warn
    - name: Preserve emulator crash database
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: prototype-emulator-crashes-api-36
        path: /tmp/android-runner/emu-crash-*/
        if-no-files-found: warn
    - name: Capture host diagnostics on emulator failure
      if: failure()
      run: |
        free -h
        df -h
        sudo dmesg --ctime | tail -100
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: prototype-focused-api-36
        path: |-
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
          app/build/outputs/connected_android_test_additional_output/

          prototype-evidence/
          prototype-iterations/
          prototype-runner-environment.txt
        if-no-files-found: error
    name: Prototype focused API 36
