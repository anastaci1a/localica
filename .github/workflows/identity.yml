name: Commit identity
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  identity:
    name: Commit identities and attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Exercise identity guard policy
        run: node .github/tests/test_commit_identity.mjs
      - name: Verify commit identities and attribution
        run: node .github/check-commit-identity.mjs
