// CI-only: AGP compiles both APKs after installation, before instrumentation.
// FULL_COMPILATION runs cmd package compile -m speed -f for each package.
if (System.getenv('GITHUB_ACTIONS') != 'true' || System.getenv('TEST_API') != '26') {
    throw new GradleException('API 26 AOT setup requires the API 26 CI lane')
}
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        project.extensions.getByName('androidComponents').onVariants { variant ->
            if (variant.name == 'debug') {
                variant.androidTest.experimentalProperties.put('android.experimental.force-aot-compilation', true)
            }
        }
    }
}
