org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Dependency downloads retry transient failures (HTTP 5xx, resets, timeouts) up to five attempts from a 2 s back-off (#681).
systemProp.org.gradle.internal.network.retry.max.attempts=5
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
android.useAndroidX=true
kotlin.code.style=official
